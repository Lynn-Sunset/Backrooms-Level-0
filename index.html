<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

  #overlay {
    position: fixed; inset: 0;

  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay input {
    margin-top: 20px; padding: 8px 16px; font-size: 1rem;

  }
  #overlay input::placeholder { color: #887; }
  #overlay button {
    margin-top: 16px; padding: 10px 32px; font-size: 1rem; cursor: pointer;
    background: rgba(232,213,149,0.15); border: 1px solid #e8d595; color: #e8d595;

  #overlay button:hover { background: rgba(232,213,149,0.3); }
  #overlay .hint { margin-top: 24px; color: #999; font-size: 0.8rem; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* 计时器 */
  /* 正计时 — 右上角 */
  #elapsed-time {
    position: fixed; top: 14px; right: 24px;
    z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.5s;

  #info {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);

  /* 暗角 —— 营造幽闭氛围 */

  /* 胶片颗粒 —— 静态噪点纹理，GPU 友好 */
  #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

  /* 游戏结束 */

<script type="importmap">
{

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

console.log('🏚️ Backrooms Level 0 启动中...');

// ==================== 配置 ====================
const GRID_W       = 10;
const GRID_H       = 10;
const ROOM_SIZE    = 5;
const ROOM_HEIGHT  = 3;
const WALL_THICK   = 0.15;
const DOOR_WIDTH   = 2.0;
const PLAYER_SPEED = 5.5;
const PLAYER_RAD   = 0.4;
const EYE_HEIGHT   = 1.65;

// ==================== 迷宫生成 ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateMaze() {
  const cells = [];
  for (let z = 0; z < GRID_H; z++) {
    cells[z] = [];
    for (let x = 0; x < GRID_W; x++) {
      cells[z][x] = { x, z, visited: false, walls: { n: true, s: true, e: true, w: true } };
    }
  }

  function carve(x, z) {
    cells[z][x].visited = true;
    for (const d of shuffle([
      { dx: 0, dz: -1, w: 'n', opp: 's' },
      { dx: 0, dz:  1, w: 's', opp: 'n' },
      { dx: 1, dz:  0, w: 'e', opp: 'w' },
      { dx:-1, dz:  0, w: 'w', opp: 'e' }
    ])) {
      const nx = x + d.dx, nz = z + d.dz;
      if (nx >= 0 && nx < GRID_W && nz >= 0 && nz < GRID_H && !cells[nz][nx].visited) {
        cells[z][x].walls[d.w] = false;
        cells[nz][nx].walls[d.opp] = false;
        carve(nx, nz);
      }
    }
  }
  carve(0, 0);

  // 额外通道 —— 打破完美迷宫，制造环路
  for (let z = 0; z < GRID_H; z++) {
    for (let x = 0; x < GRID_W; x++) {
      if (z < GRID_H - 1 && cells[z][x].walls.s && Math.random() < 0.15) {
        cells[z][x].walls.s = false;
        cells[z+1][x].walls.n = false;
      }
      if (x < GRID_W - 1 && cells[z][x].walls.e && Math.random() < 0.15) {
        cells[z][x].walls.e = false;
        cells[z][x+1].walls.w = false;
      }
    }
  }
  return cells;
}

const maze = generateMaze();

// ==================== Three.js 初始化 ====================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#a89868');
// 更浓的雾 —— 远处消失在昏黄中
scene.fog = new THREE.Fog('#b8a070', 10, 42);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 80);
// 出生房间坐标
const SPAWN_GX = Math.floor(GRID_W / 2);
const SPAWN_GZ = Math.floor(GRID_H / 2);
camera.position.set(
  (SPAWN_GX + 0.5) * ROOM_SIZE,
  EYE_HEIGHT,
  (SPAWN_GZ + 0.5) * ROOM_SIZE
);

// ==================== 材质 ====================
// 墙纸纹理生成 — 512px · 8种高对比图案 · 护墙板腰线
function generateWallpaper(seed) {
  const S = 256;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#e6d28a';
  ctx.fillRect(0, 0, S, S);

  const t = seed % 6;
  // 护墙板 — 底部 28% 深木色，腰线过渡
  const hasWainscot = t >= 4;
  const wTop = hasWainscot ? S * 0.72 : 0;
  if (hasWainscot) {
    const g = ctx.createLinearGradient(0, S*0.72, 0, S*0.80);
    g.addColorStop(0, '#b89868'); g.addColorStop(0.5, '#c8a878'); g.addColorStop(1, '#e6d28a');
    ctx.fillStyle = g;
    ctx.fillRect(0, S*0.72, S, S*0.08);
    ctx.fillStyle = '#b89868';
    ctx.fillRect(0, 0, S, S*0.72);
    ctx.strokeStyle = 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 2;
    for (let x = S*0.12; x < S; x += S*0.25) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, S*0.72); ctx.stroke();
    }
  }

  switch(t) {
    case 0: // 粗竖条纹
      ctx.fillStyle = 'rgba(190,170,110,0.28)';
      for (let x = 0; x < S; x += 16) ctx.fillRect(x, 0, 7, S);
      ctx.fillStyle = 'rgba(160,140,90,0.14)';
      for (let y = 48; y < S; y += 48) ctx.fillRect(0, y, S, 1);
      break;
    case 1: // 大菱形格纹
      ctx.strokeStyle = 'rgba(150,130,80,0.20)'; ctx.lineWidth = 2;
      const step = 48;
      for (let y = -step; y < S+step; y += step) {
        for (let x = ((Math.floor(y/step)%2)?step/2:0); x < S; x += step) {
          ctx.fillStyle = 'rgba(170,150,100,0.18)';
          ctx.beginPath();
          ctx.moveTo(x, y-step/2); ctx.lineTo(x+step/2, y);
          ctx.lineTo(x, y+step/2); ctx.lineTo(x-step/2, y);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      }
      break;
    case 2: // 大朵花卉
      for (let i = 0; i < 35; i++) {
        const fx=Math.random()*S, fy=Math.random()*S, r=10+Math.random()*18;
        for (let p=0; p<5+Math.floor(Math.random()*3); p++) {
          const a=(p/5)*Math.PI*2+Math.random()*0.3;
          ctx.fillStyle=`rgba(180,150,100,${0.14+Math.random()*0.16})`;
          ctx.beginPath();
          ctx.arc(fx+Math.cos(a)*r*0.5, fy+Math.sin(a)*r*0.5, r*0.55, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.fillStyle='rgba(160,120,80,0.22)';
        ctx.beginPath(); ctx.arc(fx, fy, r*0.22, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 3: // 横板条
      ctx.fillStyle = 'rgba(180,160,110,0.18)';
      for (let y = 0; y < S; y += 22) ctx.fillRect(0, y, S, 11);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
      for (let y = 0; y < S; y += 22) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }
      break;
    case 4: // 方格瓷砖 + 护墙板
      if (!hasWainscot) {
        const ts2=32;
        for (let y=0; y<S; y+=ts2) for (let x=0; x<S; x+=ts2) {
          if ((Math.floor(x/ts2)+Math.floor(y/ts2))%2===0) {
            ctx.fillStyle='rgba(200,180,120,0.22)'; ctx.fillRect(x,y,ts2,ts2);
          }
        }
        ctx.strokeStyle='rgba(0,0,0,0.10)'; ctx.lineWidth=1;
        for (let y=0; y<=S; y+=ts2) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }
        for (let x=0; x<=S; x+=ts2) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,S); ctx.stroke(); }
      } else {
        // 护墙板上方大方格
        const ts3=40;
        for (let y=wTop; y<S; y+=ts3) for (let x=0; x<S; x+=ts3) {
          if ((Math.floor(x/ts3)+Math.floor(y/ts3))%2===0) {
            ctx.fillStyle='rgba(190,165,110,0.20)'; ctx.fillRect(x,y,ts3,ts3);
          }
        }
        ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1;
        for (let y=wTop; y<=S; y+=ts3) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }
        for (let x=0; x<=S; x+=ts3) { ctx.beginPath(); ctx.moveTo(x,wTop); ctx.lineTo(x,S); ctx.stroke(); }
      }
      break;
    case 5: // 护墙板 + 竖条
      for (let x=0; x<S; x+=14) { ctx.fillStyle='rgba(175,155,105,0.20)'; ctx.fillRect(x,wTop,6,S-wTop); }
      break;
    case 6: // 护墙板 + 菱形
      {
        const ds2=40;
        for (let y=wTop; y<S; y+=ds2) {
          for (let x=((Math.floor(y/ds2)%2)?ds2/2:0); x<S; x+=ds2) {
            ctx.fillStyle='rgba(170,150,100,0.18)';
            ctx.beginPath();
            ctx.moveTo(x,y-ds2/2); ctx.lineTo(x+ds2/2,y); ctx.lineTo(x,y+ds2/2); ctx.lineTo(x-ds2/2,y);
            ctx.closePath(); ctx.fill();
          }
        }
      }
      break;
    case 7: // 护墙板 + 大马士革团花
      for (let i=0; i<22; i++) {
        const dx=Math.random()*S, dy=wTop+Math.random()*(S-wTop);
        ctx.fillStyle=`rgba(175,145,95,${0.16+Math.random()*0.15})`;
        ctx.beginPath(); ctx.arc(dx,dy,14+Math.random()*16,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgba(190,160,110,0.15)`;
        ctx.beginPath(); ctx.arc(dx+12,dy-6,7+Math.random()*8,0,Math.PI*2); ctx.fill();
      }
      break;
  }

  // 老化噪点
  const img = ctx.getImageData(0,0,S,S);
  for (let i=0; i<img.data.length; i+=4) {
    const n=(Math.random()-0.5)*8;
    img.data[i]+=n; img.data[i+1]+=n; img.data[i+2]+=n;
  }
  ctx.putImageData(img,0,0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.repeat.set(1, 1);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

// 墙纸材质池 — 6 种 256px 纹理
const WALL_MAT_POOL = [];
console.log('🎨 生成墙纸纹理...');
for (let i = 0; i < 6; i++) {
  const color = new THREE.Color('#e6d28a');
  color.offsetHSL((Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.12, (Math.random() - 0.5) * 0.06);
  const mat = new THREE.MeshPhongMaterial({
    color: color, specular: '#111111', shininess: 3
  });
  try {
    mat.map = generateWallpaper(i);
  } catch(e) {
    console.warn('纹理生成失败 pattern#' + i + ':', e.message);
  }
  WALL_MAT_POOL.push(mat);
}
console.log('✅ 墙纸纹理: ' + WALL_MAT_POOL.length + ' 种材质就绪');
function pickWallMaterial() {
  return WALL_MAT_POOL[Math.floor(Math.random() * WALL_MAT_POOL.length)];
}

const floorMatBase = new THREE.MeshPhongMaterial({
  color: '#c8b088', specular: '#000000', shininess: 1
});
const ceilMat = new THREE.MeshPhongMaterial({
  color: '#f0ede5', specular: '#222222', shininess: 8
});
const panelMat = new THREE.MeshPhongMaterial({
  color: '#ffffff', emissive: '#ffffd8', emissiveIntensity: 0.4, specular: '#000000', shininess: 0
});
const pillarMat = new THREE.MeshPhongMaterial({
  color: '#d9c878', specular: '#111111', shininess: 2
});
const trimMat = new THREE.MeshPhongMaterial({
  color: '#4a3822', specular: '#000000', shininess: 1
});

// ==================== 场景构建 ====================

// ==================== GLB 模型系统 ====================
const gltfLoader = new GLTFLoader();
const modelStore = {}; // { name: { scene, size: {w,h,d} } }

// 预加载模型并计算包围盒
function preloadModel(name) {
  return new Promise((resolve) => {
    gltfLoader.load('models/' + name + '.glb', (gltf) => {
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const size = new THREE.Vector3();
      box.getSize(size);
      modelStore[name] = { scene: gltf.scene, size, box };
      console.log('📦 ' + name + ' (' + size.x.toFixed(1) + '×' + size.y.toFixed(1) + '×' + size.z.toFixed(1) + ')');
      resolve(modelStore[name]);
    }, undefined, () => {
      console.warn('⚠️ ' + name + ' 加载失败');
      resolve(null);
    });
  });
}

// 创建模型实例，缩放到目标尺寸
function createModelInstance(name, targetW, targetH, targetD) {
  const entry = modelStore[name];
  if (!entry) return null;
  const clone = entry.scene.clone();
  const sw = targetW ? targetW / entry.size.x : 1;
  const sh = targetH ? targetH / entry.size.y : 1;
  const sd = targetD ? targetD / entry.size.z : 1;
  const s = Math.max(sw, sh, sd);
  clone.scale.setScalar(s);
  return clone;
}

// 替换程序化物体为 GLB 模型
function replaceWithModel(name, proceduralMesh, w, h, d) {
  if (modelStore[name]) {
    const m = createModelInstance(name, w, h, d);
    if (m) {
      m.position.copy(proceduralMesh.position);
      worldGroup.remove(proceduralMesh);
      worldGroup.add(m);
      console.log('🔁 替换: ' + name + ' @ (' + m.position.x.toFixed(0) + ',' + m.position.z.toFixed(0) + ')');
      return m;
    }
  }
  return null;
}

// 模型就绪回调队列
const modelCallbacks = {};
function onModelReady(name, cb) {
  if (modelStore[name]) { cb(); return; }
  if (!modelCallbacks[name]) modelCallbacks[name] = [];
  modelCallbacks[name].push(cb);
}
// 模型加载完成后执行回调
const origPreload = preloadModel;
preloadModel = function(name) {
  return origPreload(name).then(entry => {
    if (entry && modelCallbacks[name]) {
      modelCallbacks[name].forEach(cb => cb());
      delete modelCallbacks[name];
    }
    return entry;
  });
};

// ==================== 几何体合并优化 ====================
function mergeSceneMeshes() {
  // 合并所有墙壁
  const wallBatches = new Map();
  const toRemove = [];
  worldGroup.children.forEach(child => {
    if (child.isMesh && child.geometry.type === 'BoxGeometry' &&
        child.material.color && child.material.map) {
      // 墙壁材质（有纹理=墙纸）
      const mat = child.material;
      if (!wallBatches.has(mat)) wallBatches.set(mat, []);
      const clonedGeo = child.geometry.clone();
      clonedGeo.applyMatrix4(child.matrixWorld);
      wallBatches.get(mat).push(clonedGeo);
      toRemove.push(child);
    }
  });
  for (const [mat, geos] of wallBatches) {
    if (geos.length > 1) {
      const merged = mergeGeometries(geos, false);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      worldGroup.add(mesh);
    } else if (geos.length === 1) {
      // 单个的留着不动
      toRemove.splice(toRemove.indexOf(toRemove.find(c => c.material === mat)), 1);
    }
  }
  toRemove.forEach(c => { if (c.parent) worldGroup.remove(c); });
  console.log('🔧 墙壁合并: ' + toRemove.length + ' → ' + wallBatches.size + ' mesh');

  // 合并荧光灯框
  const frameBatches = new Map();
  const frameToRemove = [];
  worldGroup.children.forEach(child => {
    if (child.isMesh && child.material.color &&
        child.material.color.getHex() === 0xd8d6d0) {
      const mat = child.material;
      if (!frameBatches.has(mat)) frameBatches.set(mat, []);
      const cg = child.geometry.clone();
      cg.applyMatrix4(child.matrixWorld);
      frameBatches.get(mat).push(cg);
      frameToRemove.push(child);
    }
  });
  if (frameBatches.size > 0) {
    for (const [mat, geos] of frameBatches) {
      const merged = mergeGeometries(geos, false);
      worldGroup.add(new THREE.Mesh(merged, mat));
    }
    frameToRemove.forEach(c => { if (c.parent) worldGroup.remove(c); });
    console.log('🔧 灯框合并: ' + frameToRemove.length + ' → ' + frameBatches.size + ' mesh');
  }
}

    // HTTPS 下必须显式 resume
    audioCtx.resume().then(() => {
      console.log('🔊 AudioContext 恢复成功, 状态:', audioCtx.state);
    });

    // 嗡鸣 — 200Hz + 400Hz
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.3;
    masterGain.connect(audioCtx.destination);

    [[200, 0.6], [400, 0.2]].forEach(([freq, vol]) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = audioCtx.createGain(); g.gain.value = vol;
      osc.connect(g); g.connect(masterGain); osc.start();
    });

    // 间歇脉冲 — 响1秒、停3秒
    const pulseGain = audioCtx.createGain();
    pulseGain.gain.value = 0;
    masterGain.disconnect();
    masterGain.connect(pulseGain);
    pulseGain.connect(audioCtx.destination);

    function tickOn() {
      pulseGain.gain.setValueAtTime(1, audioCtx.currentTime);
      setTimeout(() => {
        pulseGain.gain.setValueAtTime(0, audioCtx.currentTime);
        setTimeout(tickOn, 3000);
      }, 1000);
    }
    tickOn();

    audioStarted = true;
    console.log('🔊 间歇音效已启动 (响1秒/停3秒)');
  } catch(e) {
    console.error('音频失败:', e.message);
  }
}

// ==================== 碰撞检测 ====================
function circleAABB(px, pz, r, bb) {
  const cx = Math.max(bb.minX, Math.min(px, bb.maxX));
  const cz = Math.max(bb.minZ, Math.min(pz, bb.maxZ));
  const dx = px - cx, dz = pz - cz;
  return (dx * dx + dz * dz) < (r * r);
}

// 碰撞体按房间网格分桶
const colliderGrid = [];
for (let gz = 0; gz < GRID_H; gz++) {
  colliderGrid[gz] = [];
  for (let gx = 0; gx < GRID_W; gx++) {
    colliderGrid[gz][gx] = [];
  }
}
// 将每个碰撞体分配到其覆盖的网格单元
wallColliders.forEach(bb => {
  const gxMin = Math.max(0, Math.floor(bb.minX / ROOM_SIZE));
  const gxMax = Math.min(GRID_W - 1, Math.floor(bb.maxX / ROOM_SIZE));
  const gzMin = Math.max(0, Math.floor(bb.minZ / ROOM_SIZE));
  const gzMax = Math.min(GRID_H - 1, Math.floor(bb.maxZ / ROOM_SIZE));
  for (let gz = gzMin; gz <= gzMax; gz++) {
    for (let gx = gxMin; gx <= gxMax; gx++) {
      colliderGrid[gz][gx].push(bb);
    }
  }
});

function tryMove(dx, dz) {
  const pos = controls.getObject().position;
  const px = pos.x, pz = pos.z;
  // 确定玩家所在网格及邻接网格
  const gx = Math.floor(px / ROOM_SIZE);
  const gz = Math.floor(pz / ROOM_SIZE);
  const nearby = new Set();
  for (let dz2 = -1; dz2 <= 1; dz2++) {
    for (let dx2 = -1; dx2 <= 1; dx2++) {
      const nx2 = gx + dx2, nz2 = gz + dz2;
      if (nx2 >= 0 && nx2 < GRID_W && nz2 >= 0 && nz2 < GRID_H) {
        colliderGrid[nz2][nx2].forEach(bb => nearby.add(bb));
      }
    }
  }
  // X 轴
  let nx = px + dx;
  let blockedX = false;
  for (const bb of nearby) {
    if (circleAABB(nx, pz, PLAYER_RAD, bb)) { blockedX = true; break; }
  }
  if (!blockedX) pos.x = nx;
  // Z 轴
  let nz = pz + dz;
  let blockedZ = false;
  for (const bb of nearby) {
    if (circleAABB(pos.x, nz, PLAYER_RAD, bb)) { blockedZ = true; break; }
  }
  if (!blockedZ) pos.z = nz;
}

// ==================== 灯管闪烁（高频率 — 面板联动） ====================
function updateFlickering(dt) {
  for (const fl of flickerLights) {
    fl.timer -= dt;
    // 触发闪烁
    if (fl.timer <= 0 && !fl.flickering) {
      fl.flickering = true;
      fl.flickerFrames = 3 + Math.floor(Math.random() * 10);
      fl.light.intensity = fl.baseIntensity * (0.02 + Math.random() * 0.12);
      if (fl.panel) fl.panel.material.emissiveIntensity = 0.03;
    }
    // 闪烁中
    if (fl.flickering) {
      fl.flickerFrames--;
      if (fl.flickerFrames <= 0) {
        // 结束闪烁
        fl.flickering = false;
        fl.light.intensity = fl.baseIntensity;
        if (fl.panel) fl.panel.material.emissiveIntensity = 0.4;
        fl.timer = 0.5 + Math.random() * 5;
      } else if (Math.random() < 0.5) {
        // 闪烁中随机明暗
        const flickVal = fl.baseIntensity * (0.03 + Math.random() * 0.5);
        fl.light.intensity = flickVal;
        if (fl.panel) fl.panel.material.emissiveIntensity = Math.max(0.02, flickVal / fl.baseIntensity * 0.4);
      }
    }
  }
}

// ==================== 脚步晃动 & 跳跃 ====================
let bobPhase = 0;
const BOB_AMP = 0.025;
const BOB_SPEED = 9;

let playerVelocityY = 0;
let playerGrounded = true;
const GRAVITY = 13;
const JUMP_VELOCITY = 4.8;

// ==================== 动画循环 ====================
const clock = new THREE.Clock();
let moving = false;

function animate() {
  requestAnimationFrame(animate);
  // 保持 AudioContext 活跃
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  const dt = Math.min(clock.getDelta(), 0.2);
  const pos = controls.getObject().position;

  // 移动
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.length() > 0.001) forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

  const moveDir = new THREE.Vector3();
  if (keys.w) moveDir.add(forward);
  if (keys.s) moveDir.sub(forward);
  if (keys.d) moveDir.add(right);
  if (keys.a) moveDir.sub(right);

  moving = moveDir.length() > 0.001;
  if (moving) {
    moveDir.normalize();
    const speed = PLAYER_SPEED * dt;
    tryMove(moveDir.x * speed, moveDir.z * speed);
    if (playerGrounded) bobPhase += dt * BOB_SPEED;
  } else {
    if (playerGrounded) bobPhase = 0;
  }

  // 重力 & 跳跃
  if (!playerGrounded) {
    playerVelocityY -= GRAVITY * dt;
    pos.y += playerVelocityY * dt;
    // 落地
    if (pos.y <= EYE_HEIGHT) {
      pos.y = EYE_HEIGHT;
      playerVelocityY = 0;
      playerGrounded = true;
      bobPhase = 0;
    }
    // 天花板碰撞
    if (pos.y >= ROOM_HEIGHT - 0.4) {
      pos.y = ROOM_HEIGHT - 0.4;
      playerVelocityY = 0;
    }
  }

  // 跳跃输入
  if (keys.space && playerGrounded) {
    playerVelocityY = JUMP_VELOCITY;
    playerGrounded = false;
    keys.space = false;
    bobPhase = 0;
  }

  // 头部晃动（仅地面时）
  if (playerGrounded) {
    pos.y = EYE_HEIGHT + (moving ? Math.sin(bobPhase) * BOB_AMP : 0);
  }

  // 闪烁更新
  updateFlickering(dt);

  // 浮尘漂动
  const dpArr = dustParticles.geometry.attributes.position.array;
  for (let i = 0; i < DUST_COUNT; i++) {
    const d = dustData[i];
    dpArr[i * 3]     += d.vx;
    dpArr[i * 3 + 1] += d.vy;
    dpArr[i * 3 + 2] += d.vz;
    // 环绕边界
    if (dpArr[i * 3] < 0) dpArr[i * 3] += mapW;
    if (dpArr[i * 3] > mapW) dpArr[i * 3] -= mapW;
    if (dpArr[i * 3 + 1] < 0.2) dpArr[i * 3 + 1] = ROOM_HEIGHT - 0.3;
    if (dpArr[i * 3 + 1] > ROOM_HEIGHT - 0.2) dpArr[i * 3 + 1] = 0.3;
    if (dpArr[i * 3 + 2] < 0) dpArr[i * 3 + 2] += mapH;
    if (dpArr[i * 3 + 2] > mapH) dpArr[i * 3 + 2] -= mapH;
  }
  dustParticles.geometry.attributes.position.needsUpdate = true;

  // 体力计时 + 已用时间
  if (controls.isLocked && !gameOver) {
    elapsedTime += dt;
    timeLeft -= dt;
    updateElapsedUI();

    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver = true;
      deathCount++;
      addRecord(playerName, elapsedTime, false, deathCount);
      renderLeaderboard('dead-leaderboard', playerName, elapsedTime, false);
      deadOverlay.classList.add('show');
      controls.unlock();
      console.log('💀 体力耗尽... 死亡次数: ' + deathCount);
    }
    updateStaminaUI();

    // 杏仁水悬浮动画
    if (almondMesh && !almondUsed) {
      almondMesh.position.y = 0.35 + Math.sin(elapsedTime * 2.5) * 0.08;
      almondMesh.rotation.y += dt * 0.8;
    }

    // 杏仁水拾取
    if (!almondUsed && almondMesh) {
      const adx = pos.x - almondPos.x;
      const adz = pos.z - almondPos.z;
      if (adx * adx + adz * adz < 1.2 * 1.2) {
        almondUsed = true;
        timeLeft += 60;
        updateStaminaUI();
        worldGroup.remove(almondMesh);
        almondMesh = null;
        console.log('💧 拾取杏仁水！+60 秒，剩余 ' + Math.ceil(timeLeft) + ' 秒');
      }
    }
  }

  // 出口门检测 — 仅在指针锁定时检测
  if (controls.isLocked && !gameOver) {
    for (const door of exitDoors) {
      const dx = pos.x - door.cx;
      const dz = pos.z - door.cz;
      if (dx * dx + dz * dz < 1.0 && playerGrounded) {
        const winEl = document.getElementById('win-overlay');
        if (winEl && !winEl.classList.contains('show')) {
          gameOver = true;
          addRecord(playerName, elapsedTime, true, deathCount);
          renderLeaderboard('win-leaderboard', playerName, elapsedTime, true);
          document.getElementById('win-stats').textContent =
            '通关时间: ' + formatTime(elapsedTime) + ' | 死亡次数: ' + deathCount;
          winEl.classList.add('show');
          controls.unlock();
          console.log('🏆 逃离 Level 0！时间: ' + formatTime(elapsedTime));
          break;
        }
      }
    }
  }

  // 围栏：防止走出地图
  pos.x = Math.max(PLAYER_RAD, Math.min(GRID_W * ROOM_SIZE - PLAYER_RAD, pos.x));
  pos.z = Math.max(PLAYER_RAD, Math.min(GRID_H * ROOM_SIZE - PLAYER_RAD, pos.z));

  renderer.render(scene, camera);
}

function sortRecords(arr) {
  return arr.sort((a, b) => {
    if (a.time === null && b.time === null) return 0;
    if (a.time === null) return 1;
    if (b.time === null) return -1;
    return a.time - b.time;
  });
}

  almondGroup.position.set(almondPos.x, 0.35, almondPos.z);
  worldGroup.add(almondGroup);
  almondMesh = almondGroup;
  const am = almondGroup;
  onModelReady('almond_water', () => {
    const m = replaceWithModel('almond_water', am, 0.3, 0.8, 0.3);
    if (m) almondMesh = m;
  });

  console.log('💧 杏仁水补给点已放置在房间 (' + ax + ',' + az + ')');
}

// ==================== 启动 ====================
// 出生点安全检查
{
  const sp = camera.position;
  let blocked = false;
  for (const bb of wallColliders) {
    const cx = Math.max(bb.minX, Math.min(sp.x, bb.maxX));
    const cz = Math.max(bb.minZ, Math.min(sp.z, bb.maxZ));
    if ((sp.x-cx)*(sp.x-cx) + (sp.z-cz)*(sp.z-cz) < PLAYER_RAD * PLAYER_RAD) {
      blocked = true; break;
    }
  }
  if (blocked) console.warn('⚠️ 出生点被障碍物阻挡！');
  else console.log('✅ 出生点安全');
}
animate();
console.log('🏚️  Backrooms Level 0 已就绪');
console.log('   ' + GRID_W + '×' + GRID_H + ' 迷宫 · ' + (GRID_W * ROOM_SIZE) + '×' + (GRID_H * ROOM_SIZE) + ' 单位');
console.log('   点击屏幕锁定鼠标，WASD 移动探索');
