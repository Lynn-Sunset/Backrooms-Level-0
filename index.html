// ==================== 迷宫生成 ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateMaze() {
  const cells = [];
  for (let z = 0; z < CFG.gridH; z++) {
    cells[z] = [];
    for (let x = 0; x < CFG.gridW; x++) {
      cells[z][x] = { x, z, visited: false, walls: { n: true, s: true, e: true, w: true } };
    }
  }

  function carve(x, z) {
    cells[z][x].visited = true;
    for (const d of shuffle([
      { dx: 0, dz: -1, w: 'n', opp: 's' },
      { dx: 0, dz:  1, w: 's', opp: 'n' },
      { dx: 1, dz:  0, w: 'e', opp: 'w' },
      { dx:-1, dz:  0, w: 'w', opp: 'e' }
    ])) {
      const nx = x + d.dx, nz = z + d.dz;
      if (nx >= 0 && nx < CFG.gridW && nz >= 0 && nz < CFG.gridH && !cells[nz][nx].visited) {
        cells[z][x].walls[d.w] = false;
        cells[nz][nx].walls[d.opp] = false;
        carve(nx, nz);
      }
    }
  }
  carve(0, 0);

  // 额外通道 —— 打破完美迷宫，制造环路
  for (let z = 0; z < CFG.gridH; z++) {
    for (let x = 0; x < CFG.gridW; x++) {
      const openChance = CFG.extraOpen || 0.15;
      if (z < CFG.gridH - 1 && cells[z][x].walls.s && Math.random() < openChance) {
        cells[z][x].walls.s = false;
        cells[z+1][x].walls.n = false;
      }
      if (x < CFG.gridW - 1 && cells[z][x].walls.e && Math.random() < openChance) {
        cells[z][x].walls.e = false;
        cells[z][x+1].walls.w = false;
      }
    }
  }
  return cells;
}

function disposeCurrentLevel() {
  // 清除 worldGroup：GLB 克隆体与 modelStore 共享几何体，绝不能 dispose；
  // 只释放实例自有的材质（ownedMaterials），程序化几何体照常释放。
  while(worldGroup.children.length > 0) {
    const obj = worldGroup.children[0];
    worldGroup.remove(obj);
    obj.traverse(child => {
      if (child.isMesh) {
        if (!child.userData.isModelMesh && child.geometry) child.geometry.dispose();
        if (child.userData.ownedMaterials) {
          child.userData.ownedMaterials.forEach(m => m.dispose());
          child.userData.ownedMaterials = null;
        }
        if (child.userData.ownedMaps) {
          child.userData.ownedMaps.forEach(t => t.dispose());
          child.userData.ownedMaps = null;
        }
      }
    });
  }
  // 清除旧粒子（浮尘/浓雾/灯晕/星空）
  const toRemoveScene = [];
  scene.children.forEach(c => { if (c.isPoints) toRemoveScene.push(c); });
  toRemoveScene.forEach(c => { scene.remove(c); if (c.geometry) c.geometry.dispose(); if (c.material) { if (c.material.map) c.material.map.dispose(); c.material.dispose(); } });
  // 清除碰撞和闪烁数据
  wallColliders.length = 0;
  colliderGrid.length = 0;
  flickerLights.length = 0;
  exitDoors.length = 0;
  almondPickups.length = 0;

}

try {

  if (dbg) {

const QUALITY_TIERS = ['ultra', 'high', 'medium', 'low'];
const qualitySelect = document.getElementById('quality');
let qualityMode = new URLSearchParams(location.search).get('quality') || 'auto';
if (!QUALITY_TIERS.includes(qualityMode)) qualityMode = 'auto';
qualitySelect.value = qualityMode;
let tierIndex, initialTierIndex;
(() => {
  if (isSoftware) {
    initialTierIndex = 3;
  } else {
    const mobile = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 1024);
    const dpr = window.devicePixelRatio || 1;
    // Display density is not a GPU benchmark. Start desktop at high and
    // let measured frame times lower the cost when necessary.
    initialTierIndex = mobile ? 2 : 1;
  }
  tierIndex = qualityMode === 'auto' ? initialTierIndex : QUALITY_TIERS.indexOf(qualityMode);
})();
qualitySelect.addEventListener('change', () => {
  qualityMode = qualitySelect.value;
  tierIndex = qualityMode === 'auto' ? initialTierIndex : QUALITY_TIERS.indexOf(qualityMode);
  slowSec = fastSec = fpsAccum = fpsFrames = 0;

  buildComposer();

let composer = null;
let gradePass = null, fxaaPass = null;
let reflectorFloor = null;
const aoHidden = []; // SSAO 内部渲染时临时隐藏的粒子（Points/Sprite）

// 电影级最终调色：色差 + 锐化 + 饱和 + 对比（单 pass 完成）
const GradeShader = {
  name: 'GradeShader',
  uniforms: {
    tDiffuse: { value: null },
    uTexel: { value: new THREE.Vector2(1/1920, 1/1080) },
    uAberration: { value: 0.00025 },
    uSaturation: { value: 0.96 },
    uContrast: { value: 1.025 },
    uSharpen: { value: 0.06 }
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main() {',
    '  vUv = uv;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n'),
  fragmentShader: [
    'uniform sampler2D tDiffuse;',
    'uniform vec2 uTexel;',
    'uniform float uAberration;',
    'uniform float uSaturation;',
    'uniform float uContrast;',
    'uniform float uSharpen;',
    'varying vec2 vUv;',
    'void main() {',
    '  vec2 uv = vUv;',
    '  vec2 c = uv - 0.5;',
    '  float d2 = dot(c, c);',
    '  vec2 off = c * uAberration * (0.35 + d2 * 4.0);',
    '  float r = texture2D(tDiffuse, uv + off).r;',
    '  float g = texture2D(tDiffuse, uv).g;',
    '  float b = texture2D(tDiffuse, uv - off).b;',
    '  vec3 col = vec3(r, g, b);',
    '  // 轻量反锐化（恢复 TAA/FXAA 损失的高频细节）',
    '  vec3 e = col * (1.0 + 4.0 * uSharpen);',
    '  e -= texture2D(tDiffuse, uv + vec2(uTexel.x, 0.0)).rgb * uSharpen;',
    '  e -= texture2D(tDiffuse, uv - vec2(uTexel.x, 0.0)).rgb * uSharpen;',
    '  e -= texture2D(tDiffuse, uv + vec2(0.0, uTexel.y)).rgb * uSharpen;',
    '  e -= texture2D(tDiffuse, uv - vec2(0.0, uTexel.y)).rgb * uSharpen;',
    '  col = e;',
    '  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));',
    '  col = mix(vec3(luma), col, uSaturation);',
    '  col = (col - 0.5) * uContrast + 0.5;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
};

// SSAO pass 会以 overrideMaterial 重绘整个场景：
// 1) 粒子（Points）会被 MeshNormal/MeshDepth 材质错误渲染 → 渲染期间临时隐藏
// 2) 反射面（Reflector）的 onBeforeRender 会在 override 渲染中被再次触发，
//    既污染反射纹理又把透明面当不透明几何（地板 AO 变黑）→ 一并隐藏
function shieldPassFromPoints(pass) {
  const origRender = pass.render.bind(pass);
  pass.render = function (renderer, writeBuffer, readBuffer, deltaTime, maskActive) {
    const saves = [];
    for (const o of aoHidden) { saves.push(o.visible); o.visible = false; }
    let reflVis = null;
    if (reflectorFloor) { reflVis = reflectorFloor.visible; reflectorFloor.visible = false; }
    origRender(renderer, writeBuffer, readBuffer, deltaTime, maskActive);
    for (let i = 0; i < aoHidden.length; i++) aoHidden[i].visible = saves[i];
    if (reflectorFloor) reflectorFloor.visible = reflVis;
  };
  return pass;
}

// 湿地面实时反射（仅 ultra + 仓库关卡）：反射渲染全场景，与水泥贴图混合出"湿地面"效果
function refreshReflector() {
  if (reflectorFloor) {
    worldGroup.remove(reflectorFloor);
    if (reflectorFloor.material) reflectorFloor.material.dispose();
    if (reflectorFloor.getRenderTarget) reflectorFloor.getRenderTarget().dispose();
    reflectorFloor = null;
  }
  if (QUALITY_TIERS[tierIndex] === 'ultra' && CFG.theme === 'warehouse' && mapW) {
    const geo = new THREE.PlaneGeometry(mapW, mapH);
    reflectorFloor = new Reflector(geo, {
      clipBias: 0.003, textureWidth: 1024, textureHeight: 1024, color: 0xffffff
    });
    reflectorFloor.rotation.x = -Math.PI / 2;
    reflectorFloor.position.set(mapW / 2, 0.03, mapH / 2);
    const m = reflectorFloor.material;
    m.fragmentShader = [
      'uniform sampler2D tDiffuse;',
      'uniform vec3 color;',
      'uniform mat4 textureMatrix;',
      'uniform float uOpacity;',
      'varying vec4 vUv;',
      'void main() {',
      '  vec4 base = texture2DProj(tDiffuse, vUv);',
      '  base.rgb *= color;',
      '  base.rgb = mix(vec3(0.30), base.rgb, 0.62);',
      '  gl_FragColor = vec4(base.rgb, uOpacity);',
      '}'
    ].join('\n');
    m.uniforms.uOpacity = { value: 0.30 };
    m.transparent = true;
    m.depthWrite = false;
    m.blending = THREE.NormalBlending;
    m.needsUpdate = true;
    reflectorFloor.userData.ownedMaterials = [m];
    worldGroup.add(reflectorFloor);
    console.log('🪞 湿地面实时反射已启用');
  }
}

function buildComposer() {
  if (composer) {
    for (const pass of composer.passes) pass.dispose?.();
    composer.dispose();
    composer = null;
  }
  gradePass = fxaaPass = null;
  if (isSoftware) {
    console.log('⚡ 检测到软件渲染：跳过全部后期，直出画面');
    return;
  }
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(currentPixelRatio);
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const tier = QUALITY_TIERS[tierIndex];

  if (tier === 'ultra' || tier === 'high') {
    const ssao = shieldPassFromPoints(new SSAOPass(scene, camera, window.innerWidth, window.innerHeight));
    ssao.kernelRadius = 0.22;
    ssao.minDistance = 0.001;
    ssao.maxDistance = 0.15;
    ssao.output = SSAOPass.OUTPUT.Default;
    composer.addPass(ssao);
  }
  if (tier !== 'low') {
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.24, 0.4, 1.05));
  }
  fxaaPass = new ShaderPass(FXAAShader);
  // FXAA samples offsets in UV space: resolution is the reciprocal pixel size.
  fxaaPass.material.uniforms['resolution'].value.set(
    1 / (window.innerWidth * currentPixelRatio), 1 / (window.innerHeight * currentPixelRatio));
  composer.addPass(new OutputPass());
  composer.addPass(fxaaPass);
  gradePass = new ShaderPass(GradeShader);
  gradePass.material.uniforms.uTexel.value.set(
    1 / (window.innerWidth * currentPixelRatio), 1 / (window.innerHeight * currentPixelRatio));
  composer.addPass(gradePass);
  // 初始调用时 worldGroup/mapW 尚未初始化（声明在后），构建关卡时会再次调用
  try { refreshReflector(); } catch(e) {}
  console.log('🎬 后期管线: ' + tier + ' — 清晰画面 / 无景深或冲刺残影');
}
buildComposer();

// ==================== 自适应画质：低帧率自动降分辨率 + 降档位 ====================
let fpsAccum = 0, fpsFrames = 0, slowSec = 0, fastSec = 0;
function updatePassResolutions() {
  const pw = window.innerWidth * currentPixelRatio;
  const ph = window.innerHeight * currentPixelRatio;
  if (fxaaPass && fxaaPass.material && fxaaPass.material.uniforms['resolution']) {
    fxaaPass.material.uniforms['resolution'].value.set(1 / pw, 1 / ph);
  }
  if (gradePass && gradePass.material) {
    gradePass.material.uniforms.uTexel.value.set(1 / pw, 1 / ph);
  }
}
function applyPixelRatio(pr) {
  currentPixelRatio = Math.max(0.8, Math.min(renderPixelRatio(qualityMode, window.devicePixelRatio), pr));
  renderer.setPixelRatio(currentPixelRatio);
  if (composer) {
    composer.setPixelRatio(currentPixelRatio);
    composer.setSize(window.innerWidth, window.innerHeight);
    updatePassResolutions();
  }
}
function updateAdaptiveQuality(dt) {
  if (qualityMode !== 'auto' || SHOT_MODE || document.hidden) return;
  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum < 1.0) return;
  const avg = fpsAccum / fpsFrames;
  fpsAccum = 0; fpsFrames = 0;
  if (avg > 0.055 && currentPixelRatio > 0.8) {
    applyPixelRatio(currentPixelRatio - 0.1);
  } else if (avg < 0.022 && currentPixelRatio < renderPixelRatio(qualityMode, window.devicePixelRatio)) {
    applyPixelRatio(currentPixelRatio + 0.1);
  }
  // 持续卡顿 → 降档；持续富余 → 升档（不超过初始档，避免来回抖动）
  if (avg > 0.042) {
    slowSec++; fastSec = 0;
    if (slowSec >= 6 && tierIndex < QUALITY_TIERS.length - 1) {
      tierIndex++;
      buildComposer();
      slowSec = 0;
      console.log('📉 画质自动降档 → ' + QUALITY_TIERS[tierIndex]);
    }
  } else if (avg < 0.013) {
    fastSec++; slowSec = 0;
    if (fastSec >= 15 && tierIndex > initialTierIndex) {
      tierIndex--;
      buildComposer();
      fastSec = 0;
      console.log('📈 画质自动升档 → ' + QUALITY_TIERS[tierIndex]);
    }
  } else {
    slowSec = Math.max(0, slowSec - 1);
    fastSec = Math.max(0, fastSec - 1);
  }
}

// ==================== 材质 ====================
// 墙纸纹理生成 — 512px · 8种高对比图案 · 护墙板腰线
function generateWallpaper(seed) {
  const S = 256;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#e6d28a';
  ctx.fillRect(0, 0, S, S);

  const t = seed % 6;
  // 护墙板 — 底部 28% 深木色，腰线过渡
  const hasWainscot = t >= 4;
  const wTop = hasWainscot ? S * 0.72 : 0;
  if (hasWainscot) {
    const g = ctx.createLinearGradient(0, S*0.72, 0, S*0.80);
    g.addColorStop(0, '#b89868'); g.addColorStop(0.5, '#c8a878'); g.addColorStop(1, '#e6d28a');
    ctx.fillStyle = g;
    ctx.fillRect(0, S*0.72, S, S*0.08);
    ctx.fillStyle = '#b89868';
    ctx.fillRect(0, 0, S, S*0.72);
    ctx.strokeStyle = 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 2;
    for (let x = S*0.12; x < S; x += S*0.25) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, S*0.72); ctx.stroke();
    }
  }

  switch(t) {
    case 0: // 粗竖条纹
      ctx.fillStyle = 'rgba(190,170,110,0.28)';
      for (let x = 0; x < S; x += 16) ctx.fillRect(x, 0, 7, S);
      ctx.fillStyle = 'rgba(160,140,90,0.14)';
      for (let y = 48; y < S; y += 48) ctx.fillRect(0, y, S, 1);
      break;
    case 1: // 大菱形格纹
      ctx.strokeStyle = 'rgba(150,130,80,0.20)'; ctx.lineWidth = 2;
      const step = 48;
      for (let y = -step; y < S+step; y += step) {
        for (let x = ((Math.floor(y/step)%2)?step/2:0); x < S; x += step) {
          ctx.fillStyle = 'rgba(170,150,100,0.18)';
          ctx.beginPath();
          ctx.moveTo(x, y-step/2); ctx.lineTo(x+step/2, y);
          ctx.lineTo(x, y+step/2); ctx.lineTo(x-step/2, y);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      }
      break;
    case 2: // 大朵花卉
      for (let i = 0; i < 35; i++) {
        const fx=Math.random()*S, fy=Math.random()*S, r=10+Math.random()*18;
        for (let p=0; p<5+Math.floor(Math.random()*3); p++) {
          const a=(p/5)*Math.PI*2+Math.random()*0.3;
          ctx.fillStyle=`rgba(180,150,100,${0.14+Math.random()*0.16})`;
          ctx.beginPath();
          ctx.arc(fx+Math.cos(a)*r*0.5, fy+Math.sin(a)*r*0.5, r*0.55, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.fillStyle='rgba(160,120,80,0.22)';
        ctx.beginPath(); ctx.arc(fx, fy, r*0.22, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 3: // 横板条
      ctx.fillStyle = 'rgba(180,160,110,0.18)';
      for (let y = 0; y < S; y += 22) ctx.fillRect(0, y, S, 11);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
      for (let y = 0; y < S; y += 22) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }
      break;
    case 4: // 方格瓷砖 + 护墙板
      if (!hasWainscot) {
        const ts2=32;
        for (let y=0; y<S; y+=ts2) for (let x=0; x<S; x+=ts2) {
          if ((Math.floor(x/ts2)+Math.floor(y/ts2))%2===0) {
            ctx.fillStyle='rgba(200,180,120,0.22)'; ctx.fillRect(x,y,ts2,ts2);
          }
        }
        ctx.strokeStyle='rgba(0,0,0,0.10)'; ctx.lineWidth=1;
        for (let y=0; y<=S; y+=ts2) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }
        for (let x=0; x<=S; x+=ts2) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,S); ctx.stroke(); }
      } else {
        // 护墙板上方大方格
        const ts3=40;
        for (let y=wTop; y<S; y+=ts3) for (let x=0; x<S; x+=ts3) {
          if ((Math.floor(x/ts3)+Math.floor(y/ts3))%2===0) {
            ctx.fillStyle='rgba(190,165,110,0.20)'; ctx.fillRect(x,y,ts3,ts3);
          }
        }
        ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1;
        for (let y=wTop; y<=S; y+=ts3) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }
        for (let x=0; x<=S; x+=ts3) { ctx.beginPath(); ctx.moveTo(x,wTop); ctx.lineTo(x,S); ctx.stroke(); }
      }
      break;
    case 5: // 护墙板 + 竖条
      for (let x=0; x<S; x+=14) { ctx.fillStyle='rgba(175,155,105,0.20)'; ctx.fillRect(x,wTop,6,S-wTop); }
      break;
    case 6: // 护墙板 + 菱形
      {
        const ds2=40;
        for (let y=wTop; y<S; y+=ds2) {
          for (let x=((Math.floor(y/ds2)%2)?ds2/2:0); x<S; x+=ds2) {
            ctx.fillStyle='rgba(170,150,100,0.18)';
            ctx.beginPath();
            ctx.moveTo(x,y-ds2/2); ctx.lineTo(x+ds2/2,y); ctx.lineTo(x,y+ds2/2); ctx.lineTo(x-ds2/2,y);
            ctx.closePath(); ctx.fill();
          }
        }
      }
      break;
    case 7: // 护墙板 + 大马士革团花
      for (let i=0; i<22; i++) {
        const dx=Math.random()*S, dy=wTop+Math.random()*(S-wTop);
        ctx.fillStyle=`rgba(175,145,95,${0.16+Math.random()*0.15})`;
        ctx.beginPath(); ctx.arc(dx,dy,14+Math.random()*16,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgba(190,160,110,0.15)`;
        ctx.beginPath(); ctx.arc(dx+12,dy-6,7+Math.random()*8,0,Math.PI*2); ctx.fill();
      }
      break;
  }

  // 老化噪点
  const img = ctx.getImageData(0,0,S,S);
  for (let i=0; i<img.data.length; i+=4) {
    const n=(Math.random()-0.5)*8;
    img.data[i]+=n; img.data[i+1]+=n; img.data[i+2]+=n;
  }
  ctx.putImageData(img,0,0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.repeat.set(1, 1);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

// ==================== 高清纹理工具（法线/粗糙度/各向异性/色彩空间） ====================
function makeTexture(canvas, opts = {}) {
  const tex = new THREE.CanvasTexture(canvas);
  if (opts.repeat) { tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; }
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = MAX_ANISO;
  if (opts.srgb !== false) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

// 由高度图（明暗）程序化生成切线空间法线贴图：亮处凸起、暗处凹陷
function makeNormalTexture(heightCanvas, strength = 1.0) {
  const w = heightCanvas.width, h = heightCanvas.height;
  const ctx = heightCanvas.getContext('2d');
  const img = ctx.getImageData(0, 0, w, h).data;
  const hm = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    hm[i] = (img[i*4] * 0.299 + img[i*4+1] * 0.587 + img[i*4+2] * 0.114) / 255;
  }
  const out = ctx.createImageData(w, h);
  const od = out.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xl = hm[y*w + Math.max(0, x-1)];
      const xr = hm[y*w + Math.min(w-1, x+1)];
      const yu = hm[Math.max(0, y-1)*w + x];
      const yd = hm[Math.min(h-1, y+1)*w + x];
      const gx = (xr - xl) * strength * 2.2;
      const gy = (yd - yu) * strength * 2.2;
      const inv = 1 / Math.sqrt(gx*gx + gy*gy + 1);
      const i = (y*w + x) * 4;
      od[i]   = (-gx * inv * 0.5 + 0.5) * 255;
      od[i+1] = (-gy * inv * 0.5 + 0.5) * 255;
      od[i+2] = (inv * 0.5 + 0.5) * 255;
      od[i+3] = 255;
    }
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').putImageData(out, 0, 0);
  return makeTexture(c, { srgb: false });
}

function makeRoughnessTexture(base = 235, variance = 28) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(S, S);
  for (let i = 0; i < S*S; i++) {
    const v = Math.max(0, Math.min(255, base + (Math.random() - 0.5) * 2 * variance));
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return makeTexture(c, { srgb: false });
}

// 高清墙纸 — 1024px · 8 种图案 · 雨痕/积灰/老化噪点 + 程序化法线与粗糙度
function generateWallpaperMaps(seed) {
  const S = 1024, K = S / 256;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#e6d28a';
  ctx.fillRect(0, 0, S, S);

  const t = seed % 8;
  const hasWainscot = t >= 4;
  const wTop = hasWainscot ? S * 0.72 : 0;
  if (hasWainscot) {
    const g = ctx.createLinearGradient(0, S*0.72, 0, S*0.80);
    g.addColorStop(0, '#b89868'); g.addColorStop(0.5, '#c8a878'); g.addColorStop(1, '#e6d28a');
    ctx.fillStyle = g;
    ctx.fillRect(0, S*0.72, S, S*0.08);
    ctx.fillStyle = '#b89868';
    ctx.fillRect(0, 0, S, S*0.72);
    // 护墙板木纹
    ctx.strokeStyle = 'rgba(90,60,30,0.10)'; ctx.lineWidth = 3*K;
    for (let y = 6*K; y < S*0.72; y += 14*K) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= S; x += 64*K) ctx.lineTo(x, y + Math.sin(x*0.02)*4*K + Math.random()*4*K);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2*K;
    for (let x = S*0.12; x < S; x += S*0.25) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, S*0.72); ctx.stroke();
    }
  }

  switch (t) {
    case 0: // 粗竖条纹
      for (let x = 0; x < S; x += 16*K) {
        ctx.fillStyle = 'rgba(190,170,110,0.30)'; ctx.fillRect(x, 0, 7*K, S);
        ctx.fillStyle = 'rgba(150,130,90,0.12)'; ctx.fillRect(x + 7*K, 0, 2*K, S);
      }
      ctx.fillStyle = 'rgba(160,140,90,0.14)';
      for (let y = 48*K; y < S; y += 48*K) ctx.fillRect(0, y, S, 1.2*K);
      break;
    case 1: { // 大菱形格纹
      const step = 48 * K;
      for (let y = -step; y < S + step; y += step) {
        for (let x = ((Math.floor(y/step) % 2) ? step/2 : 0); x < S; x += step) {
          ctx.fillStyle = 'rgba(170,150,100,0.20)';
          ctx.beginPath();
          ctx.moveTo(x, y - step/2); ctx.lineTo(x + step/2, y);
          ctx.lineTo(x, y + step/2); ctx.lineTo(x - step/2, y);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(150,130,80,0.28)'; ctx.lineWidth = 1.5*K; ctx.stroke();
        }
      }
      break;
    }
    case 2: // 大朵花卉
      for (let i = 0; i < 55*K; i++) {
        const fx = Math.random()*S, fy = Math.random()*S, r = (10 + Math.random()*18) * K;
        for (let p = 0; p < 5 + Math.floor(Math.random()*3); p++) {
          const a = (p/5)*Math.PI*2 + Math.random()*0.3;
          ctx.fillStyle = 'rgba(180,150,100,' + (0.14 + Math.random()*0.16).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(fx + Math.cos(a)*r*0.5, fy + Math.sin(a)*r*0.5, r*0.55, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(160,120,80,0.24)';
        ctx.beginPath(); ctx.arc(fx, fy, r*0.22, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 3: // 横板条
      for (let y = 0; y < S; y += 22*K) {
        ctx.fillStyle = 'rgba(180,160,110,0.20)'; ctx.fillRect(0, y, S, 11*K);
        ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = 1*K;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(S, y); ctx.stroke();
      }
      break;
    case 4: { // 方格瓷砖 + 护墙板
      const ts2 = 32*K;
      if (!hasWainscot) {
        for (let y = 0; y < S; y += ts2) for (let x = 0; x < S; x += ts2) {
          if ((Math.floor(x/ts2) + Math.floor(y/ts2)) % 2 === 0) {
            ctx.fillStyle = 'rgba(200,180,120,0.24)'; ctx.fillRect(x, y, ts2, ts2);
          }
        }
      } else {
        const ts3 = 40*K;
        for (let y = wTop; y < S; y += ts3) for (let x = 0; x < S; x += ts3) {
          if ((Math.floor(x/ts3) + Math.floor(y/ts3)) % 2 === 0) {
            ctx.fillStyle = 'rgba(190,165,110,0.22)'; ctx.fillRect(x, y, ts3, ts3);
          }
        }
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1.2*K;
      const gStep = (hasWainscot ? 40 : 32) * K;
      const gy0 = hasWainscot ? wTop : 0;
      for (let y = gy0; y <= S; y += gStep) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(S, y); ctx.stroke(); }
      for (let x = 0; x <= S; x += gStep) { ctx.beginPath(); ctx.moveTo(x, gy0); ctx.lineTo(x, S); ctx.stroke(); }
      break;
    }
    case 5: // 护墙板 + 竖条
      for (let x = 0; x < S; x += 14*K) {
        ctx.fillStyle = 'rgba(175,155,105,0.22)'; ctx.fillRect(x, wTop, 6*K, S - wTop);
        ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(x + 6*K, wTop, 1.2*K, S - wTop);
      }
      break;
    case 6: { // 护墙板 + 菱形
      const ds2 = 40*K;
      for (let y = wTop; y < S; y += ds2) {
        for (let x = ((Math.floor(y/ds2) % 2) ? ds2/2 : 0); x < S; x += ds2) {
          ctx.fillStyle = 'rgba(170,150,100,0.20)';
          ctx.beginPath();
          ctx.moveTo(x, y - ds2/2); ctx.lineTo(x + ds2/2, y);
          ctx.lineTo(x, y + ds2/2); ctx.lineTo(x - ds2/2, y);
          ctx.closePath(); ctx.fill();
        }
      }
      break;
    }
    case 7: // 护墙板 + 大马士革团花
      for (let i = 0; i < 40*K; i++) {
        const dx = Math.random()*S, dy = wTop + Math.random()*(S - wTop);
        ctx.fillStyle = 'rgba(175,145,95,' + (0.16 + Math.random()*0.15).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(dx, dy, (14 + Math.random()*16)*K, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(190,160,110,0.16)';
        ctx.beginPath(); ctx.arc(dx + 12*K, dy - 6*K, (7 + Math.random()*8)*K, 0, Math.PI*2); ctx.fill();
      }
      break;
  }

  // 雨痕 / 水渍竖纹
  for (let i = 0; i < 26; i++) {
    const x = Math.random()*S, w = (2 + Math.random()*5)*K;
    const g = ctx.createLinearGradient(0, 0, 0, S);
    const a = 0.03 + Math.random()*0.07;
    g.addColorStop(0, 'rgba(120,100,70,' + a + ')');
    g.addColorStop(0.6, 'rgba(120,100,70,' + (a*0.4) + ')');
    g.addColorStop(1, 'rgba(120,100,70,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, w, S);
  }
  // 顶部积灰渐变
  const dustGrad = ctx.createLinearGradient(0, 0, 0, S*0.18);
  dustGrad.addColorStop(0, 'rgba(90,80,60,0.10)');
  dustGrad.addColorStop(1, 'rgba(90,80,60,0)');
  ctx.fillStyle = dustGrad; ctx.fillRect(0, 0, S, S*0.18);

  // 老化噪点
  const img = ctx.getImageData(0, 0, S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 9;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);

  return {
    map: makeTexture(canvas),
    normal: makeNormalTexture(canvas, 1.0),
    rough: makeRoughnessTexture(245, 22)
  };
}

// L0 地毯：绒面噪点 + 色斑 + 磨损亮痕
function buildCarpetMaps() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c9ae85'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 16; i++) {
    const x = Math.random()*S, y = Math.random()*S, r = 40 + Math.random()*140;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    if (Math.random() < 0.5) { g.addColorStop(0, 'rgba(90,70,45,0.14)'); }
    else { g.addColorStop(0, 'rgba(235,215,175,0.10)'); }
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r*2, r*2);
  }
  ctx.strokeStyle = 'rgba(230,210,175,0.10)'; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.moveTo(0, S*0.5);
  ctx.bezierCurveTo(S*0.3, S*0.42, S*0.7, S*0.58, S, S*0.5); ctx.stroke();
  const img = ctx.getImageData(0, 0, S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 20;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
  return {
    map: makeTexture(c, { repeat: true }),
    normal: makeNormalTexture(c, 1.1),
    rough: makeRoughnessTexture(250, 18)
  };
}

// L0 吸音板天花板：面板格 + 麻点 + 水渍
function buildCeilMaps() {
  const S = 512, T = 64;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f1eee6'; ctx.fillRect(0, 0, S, S);
  ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 2;
  for (let y = 0; y <= S; y += T) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(S, y); ctx.stroke(); }
  for (let x = 0; x <= S; x += T) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, S); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 10;
  for (let y = T; y < S; y += T) for (let x = T; x < S; x += T) {
    ctx.strokeRect(x - T/2 + 6, y - T/2 + 6, T - 12, T - 12);
  }
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.02 + Math.random()*0.05).toFixed(3) + ')';
    ctx.fillRect(Math.random()*S, Math.random()*S, 1.6, 1.6);
  }
  for (let i = 0; i < 7; i++) {
    const x = Math.random()*S, y = Math.random()*S, r = 30 + Math.random()*70;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(140,120,90,0.16)'); g.addColorStop(1, 'rgba(140,120,90,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r*2, r*2);
  }
  return {
    map: makeTexture(c, { repeat: true }),
    normal: makeNormalTexture(c, 1.4)
  };
}

// 木饰面：纵向木纹 + 木结
function buildWoodMaps() {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a3822'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 90; i++) {
    const x = Math.random()*S, w = 0.8 + Math.random()*2.4;
    const shade = Math.random()*40 - 20;
    ctx.fillStyle = 'rgba(' + (74+shade) + ',' + (56+shade) + ',' + (34+shade) + ',0.25)';
    ctx.fillRect(x, 0, w, S);
  }
  for (let i = 0; i < 5; i++) {
    const x = Math.random()*S, y = Math.random()*S, r = 4 + Math.random()*9;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(30,20,10,0.55)');
    g.addColorStop(0.6, 'rgba(90,65,35,0.25)');
    g.addColorStop(1, 'rgba(90,65,35,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r*2, r*2);
  }
  const img = ctx.getImageData(0, 0, S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 8;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
  return {
    map: makeTexture(c, { repeat: true }),
    normal: makeNormalTexture(c, 1.2)
  };
}

function makeDustSprite() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.32)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeGlowSprite() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.12)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// 灯光体积晕：每盏灯下方一个柔和加色光斑（单 draw call 的 Points 云）
function buildLightGlow() {
  if (!glowPositions.length) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPositions), 3));
  const mat = new THREE.PointsMaterial({
    size: CFG.theme === 'warehouse' ? 9 : CFG.theme === 'garden' ? 2.6 : 5.5,
    map: makeGlowSprite(),
    color: CFG.theme === 'warehouse' ? '#dff2f4' : CFG.theme === 'garden' ? '#ffa060' : '#fff3d0',
    transparent: true,
    opacity: CFG.theme === 'warehouse' ? 0.045 : CFG.theme === 'garden' ? 0.16 : 0.075,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  glowPoints = new THREE.Points(geo, mat);
  glowPoints.frustumCulled = false;
  scene.add(glowPoints);
  aoHidden.push(glowPoints);
}

// Level 1 混凝土地板纹理 — 伸缩缝 + 污渍 + 裂缝（2m 一块平铺）
function buildL1FloorTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#56585a';
  ctx.fillRect(0, 0, 256, 256);
  // 噪点
  const img = ctx.getImageData(0, 0, 256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 24;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
  // 伸缩缝（十字中线）
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(128, 0); ctx.lineTo(128, 256); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(256, 128); ctx.stroke();
  // 污渍斑
  for (let i = 0; i < 10; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, r = 20 + Math.random() * 45;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(40,35,30,0.18)');
    g.addColorStop(1, 'rgba(40,35,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // 裂缝
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
  for (let k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(Math.random() * 256, Math.random() * 256);
    ctx.lineTo(Math.random() * 256, Math.random() * 256);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter;
  return tex;
}

// Level 1 卷帘门纹理 — 横向卷帘条 + 噪点（模块级共享，所有卷帘门复用）

function buildL2FloorTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;

  }

    const x = Math.random() * 512, y = Math.random() * 512, r = 40 + Math.random() * 120;

    g.addColorStop(1, 'rgba(50,52,56,0)');

    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // 油渍
  for (let i = 0; i < 6; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = 18 + Math.random() * 55;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(18,16,14,0.30)');
    g.addColorStop(0.7, 'rgba(30,28,24,0.12)');
    g.addColorStop(1, 'rgba(30,28,24,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // 伸缩缝：十字中缝 + 四边
  ctx.strokeStyle = 'rgba(20,20,22,0.55)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(256, 0); ctx.lineTo(256, 512); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 256); ctx.lineTo(512, 256); ctx.stroke();
  ctx.lineWidth = 2;

    ctx.lineTo(Math.random() * 512, Math.random() * 512);
    ctx.stroke();
  }
  return { map: makeTexture(c, { repeat: true }), normal: makeNormalTexture(c, 1.2) };

// ==================== GLB 模型系统 ====================
const gltfLoader = new GLTFLoader();
const modelStore = {}; // { name: { scene, size: {w,h,d} } }

// 预加载模型并计算包围盒
function preloadModel(name) {
  return new Promise((resolve) => {
    gltfLoader.load('models/' + name + '.glb', (gltf) => {
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const size = new THREE.Vector3();
      box.getSize(size);
      if (![size.x, size.y, size.z].every(v => Number.isFinite(v) && v > 0)) {
        console.warn('Invalid model bounds:', name);
        resolve(null);
        return;
      }
      gltf.scene.traverse(o => {
        if (!o.isMesh) return;
        for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
          if ('envMapIntensity' in m) m.envMapIntensity = m.metalness > 0.5 ? 0.85 : 0.55;
          for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap']) {
            if (m[key]) m[key].anisotropy = MAX_ANISO;
          }
        }
      });
      modelStore[name] = { scene: gltf.scene, size, box };
      console.log('📦 ' + name + ' (' + size.x.toFixed(1) + '×' + size.y.toFixed(1) + '×' + size.z.toFixed(1) + ')');
      resolve(modelStore[name]);
    }, undefined, () => {
      console.warn('⚠️ ' + name + ' 加载失败');
      resolve(null);
    });
  });
}

// Use a placement root so attachments never inherit the asset's fitting scale.
// Doors, bottles and pavilions keep their proportions. Architectural columns
// may change height; fixtures may fit a ceiling bay.
// 克隆体与 modelStore 共享几何体/材质（打标 isModelMesh 供 dispose 区分，避免误释放共享资源）。
function createModelInstance(name, targetW, targetH, targetD, rotY = 0) {
  const entry = modelStore[name];
  if (!entry) return null;
  const clone = entry.scene.clone();
  const sx = targetW ? targetW / entry.size.x : 1;
  const sy = targetH ? targetH / entry.size.y : 1;
  const sz = targetD ? targetD / entry.size.z : 1;
  if (name === 'pillar') clone.scale.set(Math.min(sx, sz), sy, Math.min(sx, sz));
  else if (name === 'light_panel') clone.scale.set(sx, sy, sz);
  else clone.scale.setScalar(Math.min(sx, sy, ...(name.includes('door') ? [] : [sz])));
  const center = entry.box.getCenter(new THREE.Vector3());
  const centered = name === 'pillar' || name === 'light_panel';
  clone.position.set(-center.x * clone.scale.x,
    -(centered ? center.y : entry.box.min.y) * clone.scale.y, -center.z * clone.scale.z);
  clone.traverse(o => { o.userData.isModelMesh = true; });
  const root = new THREE.Group();
  root.name = name;
  root.add(clone);
  root.rotation.y = rotY;
  return root;
}

// ==================== 静态几何合并（大幅降低 draw call） ====================
// 把大量同材质的小 mesh 合并成少量大 mesh：构建时收集 → 构建末 flushMerged()。
// 逐房间闪烁的 diffuser 面板（材质逐实例克隆）等仍保留独立 mesh。
const mergeBuckets = new Map(); // spatial cell + material -> { material, geometries }

// 把 mesh 的几何体（烘焙世界变换）收进材质桶；程序化几何体收集后即释放
// （共享几何体打上 userData.shared 标记则不在此释放，由调用方统一处理）
function collectStatic(mesh) {
  const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  if (!mat || !mesh.geometry) return;
  const g = mesh.geometry.clone();
  mesh.updateWorldMatrix(true, false);
  g.applyMatrix4(mesh.matrixWorld);
  g.computeBoundingBox();
  const center = g.boundingBox.getCenter(new THREE.Vector3());
  const cellSize = CFG.roomSize * 2;
  const key = mat.uuid + ':' + Math.floor(center.x / cellSize) + ':' + Math.floor(center.z / cellSize);
  let bucket = mergeBuckets.get(key);
  if (!bucket) {
    bucket = { material: mat, geometries: [] };
    mergeBuckets.set(key, bucket);
  }
  bucket.geometries.push(g);
  if (!mesh.userData.isModelMesh && !mesh.geometry.userData.shared) mesh.geometry.dispose();
}

// 遍历 group，把非 keepNames 的 mesh 收进合并桶并从场景移除；返回是否还有保留的 mesh
function collectGroupStatic(group, keepNames = []) {
  const toRemove = [];
  group.traverse(o => {
    if (o.isMesh && !keepNames.includes(o.name)) {
      collectStatic(o);
      toRemove.push(o);
    }
  });
  toRemove.forEach(o => { if (o.parent) o.parent.remove(o); });
  return group.children.length > 0;
}

// L0 墙面装饰：顶角线 + 腰线 + 护墙板竖框（材质 trimMat，并入合并桶）
function addL0WallMolding(cx, cz, length, alongX) {
  const t = CFG.wallThick;
  const depth = t + 0.045;
  // 顶部冠线
  const crown = new THREE.Mesh(new THREE.BoxGeometry(alongX ? length : depth, 0.09, alongX ? depth : length), trimMat);
  crown.position.set(cx, CFG.roomH - 0.03, cz);
  addTrimStatic(crown);
  // 腰线（chair rail）
  const rail = new THREE.Mesh(new THREE.BoxGeometry(alongX ? length : depth, 0.07, alongX ? depth : length), trimMat);
  rail.position.set(cx, 0.85, cz);
  addTrimStatic(rail);
  // 护墙板竖框：从踢脚线到腰线
  if (length > 2.0) {
    const step = 1.05;
    const y = 0.47, h = 0.695;
    for (let p = -length / 2 + 0.45; p <= length / 2 - 0.45; p += step) {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(alongX ? 0.035 : t + 0.015, h, alongX ? t + 0.015 : 0.035), trimMat);
      strip.position.set(alongX ? cx + p : cx, y, alongX ? cz : cz + p);
      addTrimStatic(strip);
    }
  }
}

// L1 墙面工业细节：墙顶金属盖板 + 竖向伸缩缝条
function addL1WallDetails(cx, cz, length, alongX) {

// 门洞门套 + 过梁填充：让门洞不再是一个“硬缺口”
function addDoorFrame(cx, cz, alongX, doorW, doorH) {
  const t = CFG.wallThick;
  const trimW = 0.13;
  const depth = t + 0.10;
  const mat = CFG.theme === 'warehouse' ? steelDoorFrameMat : CFG.theme === 'garden' ? gardenWoodMat : trimMat;
  const hw = doorW / 2 + trimW / 2;
  // 左右门套
  for (const side of [-1, 1]) {
    const jamb = new THREE.Mesh(new THREE.BoxGeometry(alongX ? trimW : depth, doorH, alongX ? depth : trimW), mat);
    jamb.position.set(alongX ? cx + side * hw : cx, doorH / 2, alongX ? cz : cz + side * hw);
    addTrimStatic(jamb);
  }
  // 顶部门套
  const topTrim = new THREE.Mesh(new THREE.BoxGeometry(alongX ? doorW + trimW * 2 : depth, trimW, alongX ? depth : doorW + trimW * 2), mat);
  topTrim.position.set(cx, doorH + trimW / 2, cz);
  addTrimStatic(topTrim);
  // 门洞上方墙体填充（过梁），使用随机墙材质
  const headerH = (CFG.roomH + 0.08) - doorH - trimW;
  if (headerH > 0.05) {

    addTrimStatic(header);
  }
}

// Level 1 高金属货架（仓储区）— 四立柱 + 4 层板 + 架上杂物，全部并入合并桶
function buildStorageShelf(sx, sz, rotY = 0) {
  const W = 2.4, D = 0.6, H = 2.4;
  const hw = W / 2, hd = D / 2;
  const cR = Math.cos(rotY), sR = Math.sin(rotY);
  const place = (ox, oy, oz) => ({
    x: sx + ox * cR - oz * sR,
    y: oy,
    z: sz + ox * sR + oz * cR
  });
  const add = (mesh, ox, oy, oz) => {
    const p = place(ox, oy, oz);
    mesh.position.set(p.x, p.y, p.z);
    mesh.rotation.y = rotY;
    collectStatic(mesh);
  };
  // 四角立柱
  for (const [dx, dz] of [[-hw, -hd], [hw, -hd], [-hw, hd], [hw, hd]]) {
    add(new THREE.Mesh(new THREE.BoxGeometry(0.05, H, 0.05), shelfMat), dx, H / 2, dz);
  }
  // 层板（4 层）
  for (let i = 0; i < 4; i++) {
    add(new THREE.Mesh(new THREE.BoxGeometry(W, 0.04, D), shelfMat), 0, 0.6 + i * 0.6, 0);
  }
  // 架上杂物（0-2 个箱/桶）
  for (let i = 0; i < 2; i++) {
    if (Math.random() < 0.7) {
      const y = 0.6 + Math.floor(Math.random() * 3) * 0.6 + 0.15;
      const isBox = Math.random() < 0.6;
      const w = isBox ? 0.4 + Math.random() * 0.2 : 0.3;
      const d = isBox ? w : 0.3;
      const geo = isBox
        ? new THREE.BoxGeometry(w, w * 0.7, d)
        : new THREE.CylinderGeometry(0.28, 0.28, 0.55, 10);
      add(new THREE.Mesh(geo, isBox ? crateMat : drumMat),
        (Math.random() - 0.5) * (W - w - 0.25), y, (Math.random() - 0.5) * (D - d - 0.12));
    }
  }
  // 挡路碰撞（旋转后取轴向 AABB）
  wallColliders.push({
    minX: sx - (hw * Math.abs(cR) + hd * Math.abs(sR)),
    maxX: sx + (hw * Math.abs(cR) + hd * Math.abs(sR)),
    minZ: sz - (hw * Math.abs(sR) + hd * Math.abs(cR)),
    maxZ: sz + (hw * Math.abs(sR) + hd * Math.abs(cR))
  });
}

// Level 1 工业卷帘门 — 贴在房间实墙内面（纯装饰，无碰撞：门洞判定由 solidSideForRoom 保证选实墙）
function buildRollerDoor(px, pz, alongX) {
  const W = 3.2, H = 3.0;
  const panel = new THREE.Mesh(
    new THREE.BoxGeometry(alongX ? W : 0.08, H, alongX ? 0.08 : W), rollerDoorMat);
  panel.position.set(px, H / 2, pz);

  if (alongX) drum.rotation.z = Math.PI / 2; else drum.rotation.x = Math.PI / 2;
  drum.position.set(px, H + 0.13, pz);

// L2 外圈升降门：四面外墙各 1 个，模拟仓库月台门（装饰，无碰撞）
function buildL2DockDoors() {
  const mapW = CFG.gridW * CFG.roomSize;
  const mapH = CFG.gridH * CFG.roomSize;
  const inOff = CFG.wallThick / 2 + 0.35;
  const slots = [
    { px: inOff, pz: mapH * 0.35, alongX: false },
    { px: mapW - inOff, pz: mapH * 0.62, alongX: false },
    { px: mapW * 0.30, pz: inOff, alongX: true },
    { px: mapW * 0.68, pz: mapH - inOff, alongX: true }
  ];
  for (const sl of slots) buildDockDoor(sl.px, sl.pz, sl.alongX);
}

// 返回房间 (x,z) 一个实墙侧（用于贴卷帘门），无则 null
function solidSideForRoom(x, z) {
  const w = maze[z][x].walls;
  const t = CFG.wallThick / 2 + 0.05; // 门板中心距墙中心线（内面外推）
  const cands = [];
  if (w.n) cands.push({ px: roomCenterX(x), pz: roomCenterZ(z) + CFG.roomSize / 2 - t, alongX: true });
  if (w.s) cands.push({ px: roomCenterX(x), pz: roomCenterZ(z) - CFG.roomSize / 2 + t, alongX: true });
  if (w.e) cands.push({ px: roomCenterX(x) + CFG.roomSize / 2 - t, pz: roomCenterZ(z), alongX: false });
  if (w.w) cands.push({ px: roomCenterX(x) - CFG.roomSize / 2 + t, pz: roomCenterZ(z), alongX: false });
  if (!cands.length) return null;
  return cands[Math.floor(Math.random() * cands.length)];
}

// 园林亭子：石台基 + 柱础 + 木柱 + 枋 + 双层攒尖顶 + 美人靠 + 宝顶
function buildGardenPavilion(sx, sz, rotY = 0) {
  let pavilion = createModelInstance('pavilion', null, null, null, rotY);
  if (!pavilion) {
    pavilion = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.3, 0.5, 6), gardenStoneMat);
    base.position.y = 0.25;
    pavilion.add(base);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 1.4, 6), gardenRoofMat);
    roof.position.y = 4.3;
    pavilion.add(roof);
    pavilion.rotation.y = rotY;
  }

  // Fit the actual geometry, including stairs and rotated roof corners, inside
  // a centered circle. Every doorway retains a generous route around the prop.
  const vertices = [];
  let radius = 0;
  pavilion.updateWorldMatrix(true, true);
  pavilion.traverse(mesh => {
    if (!mesh.isMesh) return;
    const position = mesh.geometry.attributes.position;
    for (let i = 0; i < position.count; i++) {
      const p = new THREE.Vector3().fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld);
      radius = Math.max(radius, Math.hypot(p.x, p.z));
      vertices.push(p);
    }
  });
  const scale = pavilionScale(radius, CFG);
  pavilion.scale.setScalar(scale);
  pavilion.position.set(sx, 0, sz);

  // The raised platform remains solid. Its convex outline follows the stone
  // and steps; high roof overhangs do not create invisible ground-level walls.
  const collider = convexFootprint(vertices
    .filter(p => p.y * scale <= CFG.eyeH + 0.3)
    .map(p => ({ x: sx + p.x * scale, z: sz + p.z * scale })));
  if (collider) wallColliders.push(collider);
  pavilionPlacements.push({ x: sx, z: sz, radius: radius * scale });
  if (collectGroupStatic(pavilion, [])) worldGroup.add(pavilion);
}

// 假山：多块灰湖石堆叠 + 碎石 + 青苔点
// 有机假山石：二十面体 + 顶点随机扰动（模拟太湖石天然形态）
function makeOrganicRock(radius, detail = 1) {
  const geo = new THREE.IcosahedronGeometry(radius, detail + 1);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const phase = Math.random() * Math.PI * 2;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // Duplicate face vertices must receive the same displacement; independent
    // random values tore the stone into disconnected triangular shards.
    const nx = v.x / radius, ny = v.y / radius, nz = v.z / radius;
    v.multiplyScalar(.94 + .12 * Math.sin(nx * 4 + phase) * Math.cos(ny * 3 - phase)
      + .055 * Math.sin(nz * 7 + nx * 2 + phase));
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.deleteAttribute('normal');
  geo.deleteAttribute('uv');
  const welded = mergeVertices(geo, .00001);
  geo.dispose();
  welded.computeVertexNormals();
  return welded;
}

function buildGardenRockery(sx, sz) {
  const n = 7 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {

    stone.scale.set(0.75 + Math.random() * 0.7, scaleY, 0.7 + Math.random() * 0.7);
    stone.position.set(
      sx + (Math.random() - 0.5) * 2.8,
      big ? 0.22 + scaleY * r * 0.35 : 0.08 + scaleY * r * 0.25,

    );
    stone.rotation.set(Math.random() * 0.8, Math.random() * Math.PI, Math.random() * 0.8);

// 池塘：自然曲岸水面 + 荷叶 + 拱桥 + 岸石
function buildGardenPond(sx, sz) {
  const shape = new THREE.Shape();
  const pts = 8;
  for (let i = 0; i <= pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const r = 1.6 + Math.sin(a * 2.0) * 0.65 + Math.cos(a * 3.0) * 0.45;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  const pond = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), gardenWaterMat);
  pond.rotation.x = -Math.PI / 2;
  pond.position.set(sx, 0.05, sz);

}

// 竹林：分节竹竿 + 竹节环 + 竹叶
function buildGardenBamboo(sx, sz) {
  // A creased leaf blade, shared during assembly and baked into static batches.
  const leafGeo = new THREE.BufferGeometry();
  leafGeo.setAttribute('position', new THREE.Float32BufferAttribute([
    0,0,0, .09,.012,-.026, .09,.025,0, .09,.012,.026,
    .21,.007,-.038, .21,.025,0, .21,.007,.038,
    .33,-.015,-.017, .33,.005,0, .33,-.015,.017, .43,-.045,0
  ], 3));
  leafGeo.setIndex([0,2,1, 0,3,2, 1,2,5, 1,5,4, 2,3,6, 2,6,5,
    4,5,8, 4,8,7, 5,6,9, 5,9,8, 7,8,10, 8,9,10]);
  leafGeo.computeVertexNormals();
  leafGeo.userData.shared = true;
  const n = 6 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const x = sx + (Math.random() - 0.5) * 3.6;
    const z = sz + (Math.random() - 0.5) * 3.6;
    const h = 2.2 + Math.random() * 1.8;
    const seg = 6 + Math.floor(Math.random() * 3);
    for (let s = 0; s < seg; s++) {
      const segH = h / seg;
      const radius = 0.040 - s * 0.0025;
      const stalk = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius + .003, segH, 12), bambooMat);
      stalk.position.set(x, segH * s + segH / 2, z);
      collectStatic(stalk);
      const node = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.08, 0.005, 4, 12), bambooMat);
      node.rotation.x = Math.PI / 2;
      node.position.set(x, segH * s + segH, z);
      collectStatic(node);
    }
    for (let branch = 0; branch < 3; branch++) {
      const angle = Math.random() * Math.PI * 2;
      const reach = .45 + Math.random() * .45;
      const y = h * (.64 + branch * .11);
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(x, y, z),
        new THREE.Vector3(x + Math.cos(angle) * reach * .5, y + .23, z + Math.sin(angle) * reach * .5),
        new THREE.Vector3(x + Math.cos(angle) * reach, y + .06, z + Math.sin(angle) * reach));
      collectStatic(new THREE.Mesh(new THREE.TubeGeometry(curve, 6, .006, 4, false), bambooMat));
      for (const t of [.35, .62, .88]) for (const side of [-1, 1]) {
        const leaf = new THREE.Mesh(leafGeo, gardenLeafMat);
        leaf.position.copy(curve.getPoint(t));
        leaf.rotation.set((Math.random() - .5) * .3, -angle + side * .75, (Math.random() - .5) * .22);
        leaf.scale.setScalar(.65 + Math.random() * .35);
        collectStatic(leaf);
      }
    }
  }
  leafGeo.dispose();
  wallColliders.push({ minX: sx - 1.7, maxX: sx + 1.7, minZ: sz - 1.7, maxZ: sz + 1.7 });
}

// 构建结束时把各材质桶合并为单个 mesh（同材质只发一次 draw call）
function isFiniteGeometry(g) {
  const pos = g.attributes.position;
  if (!pos) return true;
  const arr = pos.array;
  for (let i = 0; i < arr.length; i++) {
    if (!Number.isFinite(arr[i])) return false;
  }
  return true;
}

function flushMerged() {
  for (const { material: mat, geometries: geos } of mergeBuckets.values()) {
    if (!geos.length) continue;
    // 过滤含 NaN 的损坏几何体，避免渲染层 computeBoundingSphere 报错
    const validGeos = geos.filter(isFiniteGeometry);
    if (validGeos.length !== geos.length) console.warn('⚠️ 已跳过含 NaN 的几何体', mat.type || mat);
    // 按是否有 index 分组，避免 mergeGeometries 因属性不一致失败
    const compatible = new Map();
    for (const g of geos) if (!isFiniteGeometry(g)) g.dispose();
    for (const g of validGeos) {
      const signature = (g.index ? 'indexed:' : 'plain:') + Object.keys(g.attributes).sort().map(k => {
        const a = g.attributes[k];
        return `${k}/${a.itemSize}/${a.normalized}/${a.array.constructor.name}`;
      }).join(',');
      if (!compatible.has(signature)) compatible.set(signature, []);
      compatible.get(signature).push(g);
    }
    for (const group of compatible.values()) {
      if (!group.length) continue;
      const merged = mergeGeometries(group);
      if (merged) {
        group.forEach(g => g.dispose());
        merged.computeBoundingSphere();
        worldGroup.add(new THREE.Mesh(merged, mat));
      } else {
        // 兜底：逐 mesh 加入，避免物体消失
        group.forEach(g => worldGroup.add(new THREE.Mesh(g, mat)));
      }
    }
  }
  mergeBuckets.clear();
}

// 门洞合并判定 — 模块级统一（墙循环与出口门候选共用，概率按关卡的 mergeChance）
function mergedHash(x, z) {
  let hv = (x * 374761393 + z * 668265263) | 0;
  hv = ((hv ^ (hv >> 13)) * 1274126177) | 0;
  hv = hv ^ (hv >> 16);
  return Math.abs(hv) % 10;
}
function isMergedDoor(x, z) {
  return mergedHash(x, z) < Math.round((CFG.mergeChance ?? 0.2) * 10);
}

function buildCurrentLevel() {
  // 重置状态数组
  wallColliders.length = 0;
  flickerLights.length = 0;
  exitDoors.length = 0;
  colliderGrid.length = 0;
  glowPositions.length = 0;
  aoHidden.length = 0;

  // 出生房间按当前关卡网格重算（L1 网格更大，避免出生房被道具/柱子堵住）
  SPAWN_GX = Math.floor(CFG.gridW / 2);
  SPAWN_GZ = Math.floor(CFG.gridH / 2);

  // 按关卡重建材质池（先释放上一关的墙材质与贴图，防泄漏）
  WALL_MAT_POOL.forEach(m => {
    ['map', 'normalMap', 'roughnessMap', 'bumpMap'].forEach(k => { if (m[k]) m[k].dispose(); });
    m.dispose();
  });
  WALL_MAT_POOL.length = 0;
  if (CFG.theme === 'warehouse') {
    // 仓库墙面：波纹金属墙板（法线增强立体感）+ 混凝土墙板（PBR 标准材质，吃环境反射）
    const corrMaps = buildL2CorrugatedTexture();
    for (let i = 0; i < 3; i++) {
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(CFG.wallColor).offsetHSL(0, 0, (Math.random() - 0.5) * 0.05),
        roughness: 0.4 + Math.random() * 0.1,
        metalness: 0.55 + Math.random() * 0.2,
        envMapIntensity: 0.9,
        map: corrMaps.map,
        normalMap: corrMaps.normal,
        normalScale: new THREE.Vector2(1.0, 1.6)
      });
      WALL_MAT_POOL.push(mat);
    }
    // 混凝土墙板（增加变化）
    for (let i = 0; i < 2; i++) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#7e8083';
      ctx.fillRect(0, 0, 512, 512);
      const img = ctx.getImageData(0, 0, 512, 512);
      for (let j = 0; j < img.data.length; j += 4) {
        const n = (Math.random() - 0.5) * 18;
        img.data[j] += n; img.data[j+1] += n; img.data[j+2] += n;
      }
      ctx.putImageData(img, 0, 0);
      ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 2;
      for (let ly = 128; ly < 512; ly += 128) {
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(512, ly); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      for (let ty = 96; ty < 512; ty += 128) {
        for (let tx = 64; tx < 512; tx += 128) ctx.fillRect(tx, ty, 8, 8);
      }
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color('#8a8c8f').offsetHSL(0, 0, (Math.random() - 0.5) * 0.04),
        roughness: 0.85 + Math.random() * 0.1,
        metalness: 0.05,
        map: makeTexture(c, { repeat: false }),
        normalMap: makeNormalTexture(c, 0.8)
      });
      WALL_MAT_POOL.push(mat);
    }
  } else if (CFG.theme === 'garden') {
    // 园林墙面：白粉墙，带雨痕/霉斑/砖缝 + 法线

      const gm = buildGardenWallTexture();

        color: new THREE.Color(CFG.wallColor).offsetHSL(0, 0, (Math.random() - 0.5) * 0.03),
        roughness: 0.9,
        metalness: 0.0,
        map: gm.map,
        normalMap: gm.normal,
        normalScale: new THREE.Vector2(0.7, 0.7)
      });
      WALL_MAT_POOL.push(mat);
    }
  } else {
    // Level 0: 高清墙纸 + 法线 + 粗糙度
    for (let i = 0; i < 6; i++) {
      // The albedo already contains the wallpaper colour; tinting it yellow
      // a second time crushed the blue channel and made the walls muddy brown.

        color: color, roughness: 0.9, metalness: 0,
        envMapIntensity: 0.5,
        map: maps.map, normalMap: maps.normal, roughnessMap: maps.rough,
        normalScale: new THREE.Vector2(0.28, 0.28)
      });
      WALL_MAT_POOL.push(mat);
    }
  }
  floorMatBase.color.set(CFG.floorColor);

  // 地板纹理 — warehouse 水泥地 / garden 青石板 / backrooms 高清地毯（全部带法线）
  if (floorTex) { floorTex.dispose(); floorTex = null; }
  if (floorNormalTex) { floorNormalTex.dispose(); floorNormalTex = null; }
  if (floorRoughTex) { floorRoughTex.dispose(); floorRoughTex = null; }

    floorNormalTex = l2f.normal;

    floorNormalTex = gf.normal;
    floorTex.repeat.set(CFG.gridW, CFG.gridH);
    floorNormalTex.repeat.set(CFG.gridW, CFG.gridH);

    floorMatGarden.normalMap = floorNormalTex;
    floorMatGarden.needsUpdate = true;
    ceilMat.map = null; ceilMat.normalMap = null; ceilMat.needsUpdate = true;
  } else {
    const carpet = buildCarpetMaps();
    floorTex = carpet.map;
    floorNormalTex = carpet.normal;
    floorRoughTex = carpet.rough;
    floorTex.repeat.set(CFG.gridW, CFG.gridH);
    floorNormalTex.repeat.set(CFG.gridW, CFG.gridH);
    floorRoughTex.repeat.set(CFG.gridW, CFG.gridH);
    floorMatBase.map = floorTex;
    floorMatBase.normalMap = floorNormalTex;
    floorMatBase.roughnessMap = floorRoughTex;
    floorMatBase.color.set('#ffffff');
    floorMatBase.needsUpdate = true;
    // 高清吸音板天花板
    if (ceilTex) { ceilTex.dispose(); ceilTex = null; }
    if (ceilNormalTex) { ceilNormalTex.dispose(); ceilNormalTex = null; }
    const ceilM = buildCeilMaps();
    ceilTex = ceilM.map;
    ceilNormalTex = ceilM.normal;
    ceilTex.repeat.set(CFG.gridW, CFG.gridH);
    ceilNormalTex.repeat.set(CFG.gridW, CFG.gridH);
    ceilMat.map = ceilTex;
    ceilMat.normalMap = ceilNormalTex;
    ceilMat.needsUpdate = true;
  }

  // 预创建共享几何体，避免循环内重复 new；shared 标记 → collectStatic 不释放
const outletGeo = new THREE.BoxGeometry(0.13, 0.22, 0.03);
outletGeo.userData.shared = true;
const outletUseMat = new THREE.MeshStandardMaterial({ color: '#f0ede0', roughness: 0.3, metalness: 0 });

for (let z = 0; z < CFG.gridH; z++) {
  for (let x = 0; x < CFG.gridW; x++) {
    const cx = roomCenterX(x), cz = roomCenterZ(z);

    // 荧光灯面板 — 优先 GLB 模型，失败回退程序化（每间房独立材质，支持单独闪烁）
    let lightGroup, diffMesh;
    const panelW = CFG.panelW || 1.3, panelD = CFG.panelD || 3.3;
    const panelDrop = CFG.panelDrop ?? (CFG.theme === 'warehouse' ? 1.7 : 0.04);
    const glbLight = CFG.theme !== 'garden' ? createModelInstance('light_panel', panelW, 0.08, panelD) : null;
    if (glbLight && CFG.theme !== 'garden') {
      lightGroup = glbLight;
      lightGroup.position.set(cx, CFG.roomH - panelDrop, cz);
      // 找到朝下的发射面板（按名或 emissive 非黑判断），克隆材质（逐房间闪烁独立），套用本关面板色
      lightGroup.traverse(o => {
        const isEmissive = o.isMesh && o.material && o.material.emissive &&
          (o.material.emissive.r > 0 || o.material.emissive.g > 0 || o.material.emissive.b > 0);
        if (o.isMesh && (o.name === 'diffuser' || isEmissive)) {
          o.name = 'diffuser'; // 统一命名，合并时据此保留
          o.material = Array.isArray(o.material) ? o.material.map(m => m.clone()) : o.material.clone();
          o.userData.ownedMaterials = Array.isArray(o.material) ? o.material : [o.material];
          o.userData.ownedMaterials.forEach(m => {
            m.color.set(CFG.panelColor);
            m.emissive.set(CFG.panelEmissive);
            m.emissiveIntensity = CFG.panelEmissiveInt;
            m.side = THREE.DoubleSide;
          });
          diffMesh = o;
        }
      });
      if (CFG.theme === 'warehouse') addHighBayCords(lightGroup);
      collectGroupStatic(lightGroup, ['diffuser']); // 外壳/边框/分隔条 → 合并桶
      worldGroup.add(lightGroup);
    } else if (CFG.theme !== 'garden') {
      // 程序化回退 — 工业荧光灯（金属框 + 发光面板 + 分隔条）
      lightGroup = new THREE.Group();
      const frameGeo = new THREE.BoxGeometry(panelW, 0.04, panelD);
      const frameMat = new THREE.MeshStandardMaterial({ color: '#d8d6d0', roughness: 0.3, metalness: 0.6 });
      lightGroup.add(new THREE.Mesh(frameGeo, frameMat));
      const diffGeo = new THREE.PlaneGeometry(panelW - 0.15, panelD - 0.2);
      const myPanelMat = panelMat.clone();
      myPanelMat.color.set(CFG.panelColor);
      myPanelMat.emissive.set(CFG.panelEmissive);
      myPanelMat.emissiveIntensity = CFG.panelEmissiveInt;
      diffMesh = new THREE.Mesh(diffGeo, myPanelMat);
      diffMesh.name = 'diffuser';
      diffMesh.rotation.x = -Math.PI / 2;
      diffMesh.position.y = -0.025;
      lightGroup.add(diffMesh);
      for (let sx = -0.3; sx <= 0.3; sx += 0.6) {
        const barGeo = new THREE.BoxGeometry(0.03, 0.01, 3.0);
        const bar = new THREE.Mesh(barGeo, frameMat);
        bar.position.set(sx, -0.022, 0);
        lightGroup.add(bar);
      }
      // 格栅纵条 ×4（美化版）
      for (const sz of [-1.2, -0.4, 0.4, 1.2]) {
        const gbar = new THREE.Mesh(new THREE.BoxGeometry(panelW - 0.2, 0.012, 0.02), frameMat);
        gbar.position.set(0, -0.028, sz);
        lightGroup.add(gbar);
      }
      lightGroup.position.set(cx, CFG.roomH - panelDrop, cz);
      if (CFG.theme === 'warehouse') addHighBayCords(lightGroup);
      collectGroupStatic(lightGroup, ['diffuser']); // 金属框/分隔条 → 合并桶
      worldGroup.add(lightGroup);
    }

    // 点光源 —— 棋盘格分布
    if (x % CFG.lightSpacing === 0 && z % CFG.lightSpacing === 0) {
      const brightnessRoll = Math.random();
      const cold = CFG.theme === 'warehouse'; // 仓库冷白；园林/前厅暖黄
      let lightIntensity, lightColor;
      if (brightnessRoll < 0.12) {
        lightIntensity = 0.04; lightColor = cold ? '#c8d8d2' : '#fff0d0';          // 坏灯 — 12%
      } else if (brightnessRoll < 0.28) {
        lightIntensity = 0.12 + Math.random() * 0.14; lightColor = cold ? '#d8e8e2' : '#f0f8e0'; // 老化 — 16%
      } else if (brightnessRoll < 0.45) {
        lightIntensity = 0.25 + Math.random() * 0.20; lightColor = cold ? '#e6f2f0' : '#fff2d8'; // 偏暗 — 17%
      } else {
        lightIntensity = 0.38 + Math.random() * 0.28; lightColor = cold ? '#f2faf8' : '#fffde8';  // 正常 — 55%
      }
      // 按主题抬升单灯强度：仓库大开间需要更远光程，园林用暖光中等亮度
      const decay = CFG.theme === 'backrooms' ? 1.25 : 1.0;
      lightIntensity *= CFG.theme === 'warehouse' ? 3.2 : CFG.theme === 'garden' ? 1.8 : 1.65;
      const ptLight = new THREE.PointLight(lightColor, lightIntensity, CFG.lightDist, decay);
      ptLight.position.set(cx,
        CFG.theme === 'warehouse' ? CFG.roomH - (CFG.panelDrop || 1.7) - 0.25 :
        CFG.theme === 'garden' ? 2.6 : CFG.roomH - 0.3, cz);
      ptLight.castShadow = false;
      worldGroup.add(ptLight);
      // 记录灯位，构建时生成体积光晕（buildLightGlow 使用）
      glowPositions.push(cx,
        CFG.theme === 'warehouse' ? CFG.roomH - (CFG.panelDrop || 1.7) - 0.55 :
        CFG.theme === 'garden' ? 2.2 : CFG.roomH - 0.5, cz);
      // 闪烁系统 —— 灯光与面板联动
      flickerLights.push({
        light: ptLight,
        panel: diffMesh,
        baseIntensity: lightIntensity,
        baseEmissive: CFG.panelEmissiveInt,   // 面板发射强度基线（L0/L1 不同）
        timer: 0.2 + Math.random() * 3.5,
        flickering: false,
        flickerFrames: 0
      });
    }

    // 随机柱子 — 优先 GLB 模型，失败回退程序化；避开门洞区域，跳过出生房间（园林不放大水泥柱）
    if (CFG.theme !== 'garden' && Math.random() < 0.12 && !(x === SPAWN_GX && z === SPAWN_GZ)) {
      // 限制在房间中心区域，避免堵门
      const margin = 1.6;
      const px = cx + (Math.random() - 0.5) * (CFG.roomSize - margin * 2);
      const pz = cz + (Math.random() - 0.5) * (CFG.roomSize - margin * 2);
      const pillar = createModelInstance('pillar', 0.32, CFG.roomH, 0.32)
        || buildProceduralPillar(CFG.roomH);
      pillar.position.set(px, CFG.roomH / 2, pz);
      if (collectGroupStatic(pillar, [])) worldGroup.add(pillar); // 全部并入合并桶
      // 碰撞体匹配视觉尺寸
      wallColliders.push({
        minX: px - 0.18, maxX: px + 0.18,
        minZ: pz - 0.18, maxZ: pz + 0.18
      });
    }

    // 踢脚线 —— 房间四边底部
    const baseH = CFG.theme === 'warehouse' ? 0.16 : CFG.theme === 'garden' ? 0.10 : 0.12;
    const baseD = 0.06;
    const baseMat = CFG.theme === 'warehouse' ? hazardStripeMat :
                    CFG.theme === 'garden' ? gardenStoneMat : trimMat;
    [
      { bx: cx, bz: cz - CFG.roomSize/2 + baseD/2, bw: CFG.roomSize },
      { bx: cx, bz: cz + CFG.roomSize/2 - baseD/2, bw: CFG.roomSize },
      { bx: cx - CFG.roomSize/2 + baseD/2, bz: cz, bw: CFG.roomSize, rot: Math.PI/2 },
      { bx: cx + CFG.roomSize/2 - baseD/2, bz: cz, bw: CFG.roomSize, rot: Math.PI/2 },
    ].forEach(b => {
      const trim = new THREE.Mesh(new THREE.BoxGeometry(b.bw, baseH, baseD), baseMat);
      trim.position.set(b.bx, baseH / 2, b.bz);
      if (b.rot) trim.rotation.y = b.rot;
      collectStatic(trim); // 踢脚线并入合并桶
    });

    // 半墙隔断 —— 跳过出生房间
    if (Math.random() < 0.16 && !(x === SPAWN_GX && z === SPAWN_GZ)) {
      const hwH = 1.2 + Math.random() * 0.8;        // 高度 1.2-2.0m（不到顶）
      const hwW = 1.5 + Math.random() * 2.5;         // 宽度 1.5-4.0m
      const hwD = 0.15;
      const hwRot = Math.random() < 0.5 ? 0 : Math.PI / 2;
      const hwGeo = new THREE.BoxGeometry(hwRot === 0 ? hwW : hwD, hwH, hwRot === 0 ? hwD : hwW);
      const hw = new THREE.Mesh(hwGeo, pickWallMaterial());
      hw.position.set(
        cx + (Math.random() - 0.5) * (CFG.roomSize - hwW - 0.6),
        hwH / 2,
        cz + (Math.random() - 0.5) * (CFG.roomSize - hwW - 0.6)
      );
      collectStatic(hw); // 半墙并入合并桶
      // 顶部压顶板（美化收边）
      const hwCap = new THREE.Mesh(
        new THREE.BoxGeometry(hwRot === 0 ? hwW + 0.06 : hwD + 0.06, 0.05, hwRot === 0 ? hwD + 0.06 : hwW + 0.06),
        CFG.theme === 'warehouse' ? steelDoorFrameMat : trimMat);
      hwCap.position.set(hw.position.x, hwH + 0.025, hw.position.z);
      collectStatic(hwCap);
      // 碰撞体
      if (hwRot === 0) {
        addWallCollider(hw.position.x, hw.position.z, hwW / 2, hwD / 2);
      } else {
        addWallCollider(hw.position.x, hw.position.z, hwD / 2, hwW / 2);
      }
    }

    // 工业道具（现实仓库，每非出生房 0-1 组）— 油桶/箱堆/托盘/水泥砖/文件柜/发电机组
    if (CFG.theme === 'warehouse' && !(x === SPAWN_GX && z === SPAWN_GZ) && Math.random() < 0.30) {
      const kind = Math.random();
      const ox = cx + (Math.random() - 0.5) * (CFG.roomSize - 2.4);
      const oz = cz + (Math.random() - 0.5) * (CFG.roomSize - 2.4);
      let halfW = 0.4, halfD = 0.4;
      if (kind < 0.28) {
        // 油桶（立/横放）— 桶身 + 两道加强箍 + 顶盖
        const horiz = Math.random() < 0.4;
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.8, 16), drumMat);
        body.position.y = 0.4;
        g.add(body);
        const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.285, 0.285, 0.02, 16), machineryMat);
        lid.position.y = 0.8;
        g.add(lid);
        for (const ry of [0.22, 0.58]) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.283, 0.013, 8, 18), machineryMat);
          ring.rotation.x = Math.PI / 2;
          ring.position.y = ry;
          g.add(ring);
        }
        if (horiz) g.rotation.z = Math.PI / 2;
        g.position.set(ox, horiz ? 0.28 : 0, oz);
        collectGroupStatic(g, []);
        halfW = 0.32; halfD = 0.32;
      } else if (kind < 0.48) {
        // 木箱堆（2-3 层）
        const stack = 2 + Math.floor(Math.random() * 2);
        for (let s = 0; s < stack; s++) {
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), crateMat);
          box.position.set(ox + (Math.random() - 0.5) * 0.15, 0.25 + s * 0.5, oz);
          collectStatic(box);
        }
        halfW = 0.34; halfD = 0.34;
      } else if (kind < 0.62) {
        // 托盘
        const pallet = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.12, 0.8), crateMat);
        pallet.position.set(ox, 0.06, oz);
        collectStatic(pallet);
        halfW = 0.5; halfD = 0.4;
      } else if (kind < 0.76) {
        // 水泥砖堆（3-5 块错位）
        const n = 3 + Math.floor(Math.random() * 3);
        for (let b = 0; b < n; b++) {
          const block = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.2), pipeMat);
          block.position.set(ox + (Math.random() - 0.5) * 0.5, 0.1 + b * 0.2, oz + (Math.random() - 0.5) * 0.4);
          collectStatic(block);
        }
        halfW = 0.3; halfD = 0.3;
      } else if (kind < 0.88) {
        // 文件柜（带抽屉线）
        const cabinet = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.3, 0.6), machineryMat);
        cabinet.position.set(ox, 0.65, oz);
        collectStatic(cabinet);
        for (let d = 0; d < 3; d++) {
          const drawer = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.02, 0.56), pipeMat);
          drawer.position.set(ox, 0.35 + d * 0.42, oz);
          collectStatic(drawer);
        }
        halfW = 0.3; halfD = 0.35;
      } else {
        // 发电机/通风机组（百叶 + 管 stub）
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.6), machineryMat);
        body.position.set(ox, 0.4, oz);
        collectStatic(body);
        for (let l = 0; l < 4; l++) {
          const louver = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.5), pipeMat);
          louver.position.set(ox - 0.46, 0.28 + l * 0.14, oz);
          collectStatic(louver);
        }
        const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8), pipeMat);
        stub.rotation.z = Math.PI / 2;
        stub.position.set(ox + 0.2, 0.9, oz + 0.2);
        collectStatic(stub);
        halfW = 0.5; halfD = 0.35;
      }
      // 挡路道具加碰撞体（在 rebuildCollisionGrid 之前）
      wallColliders.push({ minX: ox - halfW, maxX: ox + halfW, minZ: oz - halfD, maxZ: oz + halfD });
    }

    // 旧 L1 仓储室已撤销，保留为死分支
    if (CFG.theme === 'habitable' && !(x === SPAWN_GX && z === SPAWN_GZ) && Math.random() < 0.10) {
      // 2 个货架沿一侧排开 + 可选垂直第 3 个（居中偏侧，避免挡门）
      const zLine = cz + (Math.random() < 0.5 ? -1.6 : 1.6);
      const xStart = cx - 1.3;
      buildStorageShelf(xStart, zLine);
      buildStorageShelf(xStart + 2.6, zLine);
      if (Math.random() < 0.5) {
        buildStorageShelf(cx + (Math.random() < 0.5 ? -1.8 : 1.8), cz, Math.PI / 2);
      }
      // 卷帘门贴实墙内面（solidSideForRoom 保证选到实墙，不会堵门）
      const side = solidSideForRoom(x, z);
      if (side) buildRollerDoor(side.px, side.pz, side.alongX);
    }

    // 现实仓库：每房高位货架/托盘堆/叉车（跳过出生房，道具碰撞在 rebuildCollisionGrid 前加入）
    if (CFG.theme === 'warehouse' && !(x === SPAWN_GX && z === SPAWN_GZ)) {
      buildL2WarehouseRoom(x, z);
    }

    // 苏式园林：每房亭/假山/池塘/竹林/灯笼
    if (CFG.theme === 'garden' && !(x === SPAWN_GX && z === SPAWN_GZ)) {
      buildGardenRoom(x, z);
    }

    // 旧 L1 顶风管已撤销
    if (CFG.theme === 'habitable' && Math.random() < 0.4) {
      const len = 3 + Math.random() * 1.5;
      const horiz = Math.random() < 0.5;
      const span = CFG.roomSize / 2 - len / 2 - 0.25;
      const duct = new THREE.Mesh(
        new THREE.BoxGeometry(horiz ? len : 0.5, 0.3, horiz ? 0.5 : len), ductMat);
      duct.position.set(
        cx + (Math.random() - 0.5) * 2 * span,
        CFG.roomH - 0.20,
        cz + (Math.random() - 0.5) * 2 * span);
      collectStatic(duct);
    }

    // 墙面插座 —— 随机放在有实墙的墙面上（几何体和材质预创建于循环外）
    const wallsOK = [];
    if (maze[z][x].walls.n) wallsOK.push({ fx: cx, fz: cz - CFG.roomSize/2, rot: 0 });
    if (maze[z][x].walls.s) wallsOK.push({ fx: cx, fz: cz + CFG.roomSize/2, rot: 0 });
    if (maze[z][x].walls.e) wallsOK.push({ fx: cx + CFG.roomSize/2, fz: cz, rot: Math.PI/2 });
    if (maze[z][x].walls.w) wallsOK.push({ fx: cx - CFG.roomSize/2, fz: cz, rot: Math.PI/2 });
    // 旧 L1 裸露钢筋已撤销
    if (CFG.theme === 'habitable' && wallsOK.length > 0 && Math.random() < 0.55) {
      const n = 1 + Math.floor(Math.random() * 2);
      for (let r = 0; r < n && wallsOK.length; r++) {
        const w = wallsOK[Math.floor(Math.random() * wallsOK.length)];
        const rx = w.fx + (w.rot === 0 ? (Math.random() - 0.5) * (CFG.roomSize - 2) : (Math.random() - 0.5) * 0.3);
        const rz = w.fz + (w.rot !== 0 ? (Math.random() - 0.5) * (CFG.roomSize - 2) : (Math.random() - 0.5) * 0.3);
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.25, 6), rebarMat);
        rod.position.set(rx, 1.95 + Math.random() * 1.1, rz);
        // 南北墙（rot 0）沿 Z 伸出；东西墙（rot π/2）沿 X 伸出
        rod.rotation.set(w.rot === 0 ? Math.PI / 2 : 0, 0, w.rot === 0 ? 0 : Math.PI / 2);
        collectStatic(rod);
      }
    }
    // 旧 L1 接线盒已撤销
    if (CFG.theme === 'habitable' && wallsOK.length > 0 && Math.random() < 0.3) {
      const w = wallsOK[Math.floor(Math.random() * wallsOK.length)];
      const bx = w.fx + (w.rot === 0 ? (Math.random() - 0.5) * (CFG.roomSize - 1.6) : 0);
      const bz = w.fz + (w.rot !== 0 ? (Math.random() - 0.5) * (CFG.roomSize - 1.6) : 0);
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.08), pipeMat);
      box.position.set(bx, 1.4, bz); box.rotation.y = w.rot; collectStatic(box);
      const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 6), pipeMat);
      stub.position.set(bx, 1.6, bz); // 沿墙向上
      collectStatic(stub);
    }
    const outletCount = Math.random() < 0.35 ? 1 : (Math.random() < 0.2 ? 2 : 0);
    for (let o = 0; o < outletCount && wallsOK.length > 0; o++) {
      const w = wallsOK.splice(Math.floor(Math.random() * wallsOK.length), 1)[0];
      const ox = w.fx + (w.rot === 0 ? (Math.random() - 0.5) * (CFG.roomSize - 1.4) : 0);
      const oz = w.fz + (w.rot !== 0 ? (Math.random() - 0.5) * (CFG.roomSize - 1.4) : 0);
      const outlet = new THREE.Mesh(outletGeo, outletUseMat);
      outlet.position.set(ox, 0.95, oz);
      outlet.rotation.y = w.rot;
      collectStatic(outlet); // 插座并入合并桶
    }

  }
}

// 统一大天花板 —— 园林不封顶（见 buildGardenSky），其余关卡保持封闭
if (CFG.theme !== 'garden') {
  const bigCeilGeo = new THREE.PlaneGeometry(CFG.gridW * CFG.roomSize, CFG.gridH * CFG.roomSize);
  const bigCeil = new THREE.Mesh(bigCeilGeo, CFG.theme === 'warehouse' ? ceilMatL2 : ceilMat);
  bigCeil.rotation.x = Math.PI / 2;
  bigCeil.position.set(CFG.gridW * CFG.roomSize / 2, CFG.roomH - 0.02, CFG.gridH * CFG.roomSize / 2);
  worldGroup.add(bigCeil);
} else {
  buildGardenSky();
}

// 统一大地板
const bigFloorGeo = new THREE.PlaneGeometry(CFG.gridW * CFG.roomSize, CFG.gridH * CFG.roomSize);
const bigFloor = new THREE.Mesh(bigFloorGeo, CFG.theme === 'warehouse' ? floorMatL2 : CFG.theme === 'garden' ? floorMatGarden : floorMatBase);
bigFloor.rotation.x = -Math.PI / 2;
bigFloor.position.set(CFG.gridW * CFG.roomSize / 2, 0.01, CFG.gridH * CFG.roomSize / 2);
worldGroup.add(bigFloor);

// 仓库屋顶钢梁/风管结构
if (CFG.theme === 'warehouse') buildL2Structure();

// 墙壁 —— 按网格边生成，保证每段墙只建一次
// 微重叠量消除段间黑缝
const GAP = 0.025;

// 水平墙 (沿 X 方向) —— z 从 0 到 CFG.gridH
for (let z = 0; z <= CFG.gridH; z++) {
  for (let x = 0; x < CFG.gridW; x++) {
    const cx = roomCenterX(x);
    const cz = z * CFG.roomSize;
    const fullW = CFG.roomSize + GAP;

    let hasWall;
    if (z === 0) hasWall = true;
    else if (z === CFG.gridH) hasWall = true;
    else hasWall = maze[z-1][x].walls.s;

    if (!hasWall) {
      const merged = isMergedDoor(x, z);
      if (!merged) {
        const segW = (CFG.roomSize - CFG.doorW) / 2 + GAP;
        if (segW > 0.1) {
          const offsetX = (CFG.roomSize + CFG.doorW) / 4;
          const leftGeo = new THREE.BoxGeometry(segW, CFG.roomH + 0.08, CFG.wallThick);
          const leftWall = new THREE.Mesh(leftGeo, pickWallMaterial());
          leftWall.position.set(cx - offsetX, CFG.roomH / 2, cz);
          leftWall.castShadow = true; leftWall.receiveShadow = true;
          collectStatic(leftWall); // 墙体并入合并桶
          addWallCollider(cx - offsetX, cz, (segW - GAP) / 2, CFG.wallThick / 2);

// 程序化出口门回退（GLB 加载失败时）
function buildProceduralDoor(d, isH, panelMat = doorPanelMat, frameMat = doorFrameMat) {
  const DW = 1.75, DH = 1.4, DD = 0.2, FT = 0.12;
  const g = new THREE.Group();
  const panelW = isH ? DW - FT*2 : DD;
  const panelD = isH ? DD : DW - FT*2;
  const panelH = DH - FT*2;
  const panelMesh = new THREE.Mesh(new THREE.BoxGeometry(panelW, panelH, panelD), panelMat);
  panelMesh.position.set(0, DH/2, 0);
  g.add(panelMesh);
  const topMesh = new THREE.Mesh(
    new THREE.BoxGeometry(isH ? DW : FT*2, FT, isH ? FT*2 : DW), frameMat);
  topMesh.position.set(0, DH + FT/2, 0);
  g.add(topMesh);
  const sideW = isH ? FT : FT*2;
  const sideD = isH ? FT : FT*2;
  const leftMesh = new THREE.Mesh(new THREE.BoxGeometry(sideW, DH, sideD), frameMat);
  leftMesh.position.set(isH ? -DW/2 + FT/2 : 0, DH/2, isH ? 0 : -DW/2 + FT/2);
  g.add(leftMesh);
  const rightMesh = new THREE.Mesh(new THREE.BoxGeometry(sideW, DH, sideD), frameMat);
  rightMesh.position.set(isH ? DW/2 - FT/2 : 0, DH/2, isH ? 0 : DW/2 - FT/2);
  g.add(rightMesh);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8),
    new THREE.MeshPhongMaterial({ color: '#ffd700', specular: '#ffffff', shininess: 80 }));
  knob.position.set(isH ? DW/2 - 0.3 : (d.nx > 0 ? DD/2 + 0.05 : -DD/2 - 0.05),
    DH * 0.5, isH ? (d.nz > 0 ? DD/2 + 0.05 : -DD/2 - 0.05) : DW/2 - 0.3);
  g.add(knob);
  return g;
}

// Level 1: 顶部管道 —— 沿实墙线长程铺设。偏移墙中 0.17（墙厚 0.18 占 ±0.09 + 管半径 0.055）
// 越门洞/垂直墙即"穿墙而过"，属真实效果；每房间中心加法兰环。全部并入 pipeMat 一个合并桶。
function buildL1Pipes() {
  const mapW = CFG.gridW * CFG.roomSize;
  const mapH = CFG.gridH * CFG.roomSize;
  const y = CFG.roomH - 0.10;
  // 水平墙线（z=0..gridH，每线 x=0..gridW-1）

    let solid = 0;
    for (let x = 0; x < CFG.gridW; x++) {
      const hasWall = z === 0 || z === CFG.gridH || maze[z - 1][x].walls.s;
      if (hasWall || isMergedDoor(x, z)) solid++;
    }
    if (solid >= 2 && Math.random() < 0.65) {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, mapW, 12), pipeMat);
      pipe.rotation.z = Math.PI / 2;
      pipe.position.set(mapW / 2, y, z * CFG.roomSize + 0.17);
      collectStatic(pipe);
      for (let x = 0; x < CFG.gridW; x++) {
        const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.12, 10), pipeMat);
        flange.rotation.z = Math.PI / 2;
        flange.position.set(roomCenterX(x), y, z * CFG.roomSize + 0.17);
        collectStatic(flange);
      }
    }
  }
  // 垂直墙线（x=0..gridW，每线 z=0..gridH-1）
  for (let x = 0; x <= CFG.gridW; x++) {
    let solid = 0;
    for (let z = 0; z < CFG.gridH; z++) {
      const hasWall = x === 0 || x === CFG.gridW || maze[z][x - 1].walls.e;
      if (hasWall || isMergedDoor(x, z)) solid++;
    }
    if (solid >= 2 && Math.random() < 0.65) {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, mapH, 12), pipeMat);
      pipe.rotation.x = Math.PI / 2;
      pipe.position.set(x * CFG.roomSize + 0.17, y, mapH / 2);
      collectStatic(pipe);
      for (let z = 0; z < CFG.gridH; z++) {
        const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.12, 10), pipeMat);
        flange.rotation.x = Math.PI / 2;
        flange.position.set(x * CFG.roomSize + 0.17, y, roomCenterZ(z));
        collectStatic(flange);
      }
    }
  }
}

// ==================== 背景音效（Web Audio API 生成） ====================
let audioCtx = null;
let audioStarted = false;

function startAmbient() {
  if (audioStarted) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();

    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.3;
    masterGain.connect(audioCtx.destination);

    [[200, 0.6], [400, 0.2]].forEach(([freq, vol]) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = audioCtx.createGain(); g.gain.value = vol;
      osc.connect(g); g.connect(masterGain); osc.start();
    });

    const pulseGain = audioCtx.createGain();
    pulseGain.gain.value = 0;
    masterGain.disconnect();
    masterGain.connect(pulseGain);
    pulseGain.connect(audioCtx.destination);

    function tickOn() {
      pulseGain.gain.setValueAtTime(1, audioCtx.currentTime);
      setTimeout(() => {
        pulseGain.gain.setValueAtTime(0, audioCtx.currentTime);
        setTimeout(tickOn, 3000);
      }, 1000);
    }
    tickOn();

    audioStarted = true;
    console.log('🔊 间歇音效已启动');
  } catch(e) {
    console.error('音频失败:', e.message);
  }
}
