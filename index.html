// ==================== 碰撞检测 ====================
// 碰撞体按房间网格分桶 — 每次重建关卡后必须重算（否则 Level 1 过渡后无碰撞）
function rebuildCollisionGrid() {
  for (let gz = 0; gz < CFG.gridH; gz++) {
    colliderGrid[gz] = [];
    for (let gx = 0; gx < CFG.gridW; gx++) {
      colliderGrid[gz][gx] = [];
    }
  }
  // 将每个碰撞体分配到其覆盖的网格单元
  wallColliders.forEach(bb => {
    const gxMin = Math.max(0, Math.floor(bb.minX / CFG.roomSize));
    const gxMax = Math.min(CFG.gridW - 1, Math.floor(bb.maxX / CFG.roomSize));
    const gzMin = Math.max(0, Math.floor(bb.minZ / CFG.roomSize));
    const gzMax = Math.min(CFG.gridH - 1, Math.floor(bb.maxZ / CFG.roomSize));
    for (let gz = gzMin; gz <= gzMax; gz++) {
      for (let gx = gxMin; gx <= gxMax; gx++) {
        colliderGrid[gz][gx].push(bb);
      }
    }
  });
}

const nearbyColliders = [];
let colliderQueryStamp = 0;

function tryMove(dx, dz) {
  const pos = controls.getObject().position;
  // 子步移动：低帧率下大步长会直接穿透薄墙（0.15~0.18 厚）造成瞬移/闪回，
  // 把单步拆成不超过碰撞半径的小步，逐段做轴分离碰撞检测。
  const dist = Math.hypot(dx, dz);
  const maxStep = CFG.playerRad * 0.5;
  const steps = Math.max(1, Math.ceil(dist / maxStep));
  const sdx = dx / steps;
  const sdz = dz / steps;
  for (let s = 0; s < steps; s++) {
    const px = pos.x, pz = pos.z;
    // 确定玩家所在网格及邻接网格
    const gx = Math.floor(px / CFG.roomSize);
    const gz = Math.floor(pz / CFG.roomSize);
    nearbyColliders.length = 0;
    colliderQueryStamp++;
    for (let dz2 = -1; dz2 <= 1; dz2++) {
      for (let dx2 = -1; dx2 <= 1; dx2++) {
        const nx2 = gx + dx2, nz2 = gz + dz2;
        if (nx2 < 0 || nx2 >= CFG.gridW || nz2 < 0 || nz2 >= CFG.gridH) continue;
        const cell = colliderGrid[nz2] && colliderGrid[nz2][nx2];
        if (!cell) continue;
        for (let i = 0; i < cell.length; i++) {
          const bb = cell[i];
          if (bb._qstamp !== colliderQueryStamp) {
            bb._qstamp = colliderQueryStamp;
            nearbyColliders.push(bb);
          }
        }
      }
    }
    // X 轴
    let nx = px + sdx;
    let blockedX = false;
    for (const bb of nearbyColliders) {
      if (circleIntersectsCollider(nx, pz, CFG.playerRad, bb)) { blockedX = true; break; }
    }
    if (!blockedX) pos.x = nx;
    // Z 轴
    let nz = pz + sdz;
    let blockedZ = false;
    for (const bb of nearbyColliders) {
      if (circleIntersectsCollider(pos.x, nz, CFG.playerRad, bb)) { blockedZ = true; break; }
    }
    if (!blockedZ) pos.z = nz;
  }
}

// ==================== 灯管闪烁（高频率 — 面板联动） ====================
function updateFlickering(dt) {
  for (const fl of flickerLights) {
    fl.timer -= dt;
    // 触发闪烁
    if (fl.timer <= 0 && !fl.flickering) {
      fl.flickering = true;
      fl.flickerFrames = 3 + Math.floor(Math.random() * 10);
      fl.light.intensity = fl.baseIntensity * (0.02 + Math.random() * 0.12);
      if (fl.panel) fl.panel.material.emissiveIntensity = fl.baseEmissive * 0.05;
    }
    // 闪烁中
    if (fl.flickering) {
      fl.flickerFrames--;
      if (fl.flickerFrames <= 0) {
        // 结束闪烁
        fl.flickering = false;
        fl.light.intensity = fl.baseIntensity;
        if (fl.panel) fl.panel.material.emissiveIntensity = fl.baseEmissive;
        fl.timer = 0.5 + Math.random() * 5;
      } else if (Math.random() < 0.5) {
        // 闪烁中随机明暗
        const flickVal = fl.baseIntensity * (0.03 + Math.random() * 0.5);
        fl.light.intensity = flickVal;
        if (fl.panel) fl.panel.material.emissiveIntensity = Math.max(fl.baseEmissive * 0.03, flickVal / fl.baseIntensity * fl.baseEmissive);
      }
    }
  }
}

// ==================== 脚步晃动 & 跳跃 ====================
let bobPhase = 0;
const BOB_AMP = 0.025;
const BOB_SPEED = 9;
const landingFeedback = new LandingFeedback();

let playerVelocityY = 0;
let playerGrounded = true;
const GRAVITY = 13;
const JUMP_VELOCITY = 4.8;

// ==================== 动画循环 ====================
const clock = new THREE.Clock();
let moving = false;
// 复用临时向量 —— 动画循环内不 new，消除每帧 GC 压力
const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _moveDir = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  const dt = Math.min(clock.getDelta(), 0.2);
  updateAdaptiveQuality(dt);
  landingFeedback.update(dt);
  const pos = controls.getObject().position;

  // 移动（复用临时向量）
  camera.getWorldDirection(_forward);
  _forward.y = 0;
  if (_forward.lengthSq() > 0.000001) _forward.normalize();
  _right.crossVectors(_forward, _up).normalize();

  _moveDir.set(0, 0, 0);
  if (keys.w) _moveDir.add(_forward);
  if (keys.s) _moveDir.sub(_forward);
  if (keys.d) _moveDir.add(_right);
  if (keys.a) _moveDir.sub(_right);

  moving = _moveDir.lengthSq() > 0.000001;
  sprinting = keys.shift && moving && !gameOver && timeLeft > 0;
  if (moving) {
    _moveDir.normalize();
    const sprintMul = sprinting ? (CFG.sprintSpeedMul || 1.6) : 1;
    const speed = CFG.playerSpeed * sprintMul * dt;
    tryMove(_moveDir.x * speed, _moveDir.z * speed);
    if (playerGrounded) bobPhase += dt * BOB_SPEED * (sprinting ? 1.4 : 1);
  } else {
    if (playerGrounded) bobPhase = 0;
  }

  // 冲刺 FOV 动态拉伸（速度感）
  const targetFov = sprinting ? 80 : 75;
  if (Math.abs(camera.fov - targetFov) > 0.01) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
    camera.updateProjectionMatrix();
  }

  // 重力 & 跳跃
  if (!playerGrounded) {
    playerVelocityY -= GRAVITY * dt;
    pos.y += playerVelocityY * dt;
    // 落地
    if (pos.y <= CFG.eyeH) {
      const impact = -playerVelocityY;
      pos.y = CFG.eyeH;
      landingFeedback.impact(impact);
      playerVelocityY = 0;
      playerGrounded = true;
      bobPhase = 0;
    }
    // 天花板碰撞
    if (pos.y >= CFG.roomH - 0.4) {
      pos.y = CFG.roomH - 0.4;
      playerVelocityY = 0;
    }
  }

  // 跳跃输入
  if (keys.space && playerGrounded) {
    playerVelocityY = JUMP_VELOCITY;
    playerGrounded = false;
    keys.space = false;
    bobPhase = 0;
    landingFeedback.reset();
  }

  // 头部晃动（仅地面时）+ 静止呼吸微摆
  if (playerGrounded) {
    pos.y = CFG.eyeH + (moving ? Math.sin(bobPhase) * BOB_AMP : Math.sin(elapsedTime * 1.1) * 0.006);
  }

  // 闪烁更新
  updateFlickering(dt);

  // 浮尘漂动
  if (dustParticles) {
    const dpArr = dustParticles.geometry.attributes.position.array;
    for (let i = 0; i < DUST_COUNT; i++) {
      const d = dustData[i];
      dpArr[i * 3]     += d.vx;
      dpArr[i * 3 + 1] += d.vy;
      dpArr[i * 3 + 2] += d.vz;
      // 环绕边界
      if (dpArr[i * 3] < 0) dpArr[i * 3] += mapW;
      if (dpArr[i * 3] > mapW) dpArr[i * 3] -= mapW;
      if (dpArr[i * 3 + 1] < 0.2) dpArr[i * 3 + 1] = CFG.roomH - 0.3;
      if (dpArr[i * 3 + 1] > CFG.roomH - 0.2) dpArr[i * 3 + 1] = 0.3;
      if (dpArr[i * 3 + 2] < 0) dpArr[i * 3 + 2] += mapH;
      if (dpArr[i * 3 + 2] > mapH) dpArr[i * 3 + 2] -= mapH;
    }
    dustParticles.geometry.attributes.position.needsUpdate = true;
  }

  // 低垂浓雾缓慢漂移
  if (mistParticles) {
    const mp = mistParticles.geometry.attributes.position.array;
    for (let i = 0; i < MIST_COUNT; i++) {
      const m = mistData[i];
      mp[i * 3] += m.vx;
      mp[i * 3 + 2] += m.vz;
      if (mp[i * 3] < 0) mp[i * 3] += mapW;
      if (mp[i * 3] > mapW) mp[i * 3] -= mapW;
      if (mp[i * 3 + 2] < 0) mp[i * 3 + 2] += mapH;
      if (mp[i * 3 + 2] > mapH) mp[i * 3 + 2] -= mapH;
    }
    mistParticles.geometry.attributes.position.needsUpdate = true;
  }

  // 体力计时 + 已用时间
  if (controls.isLocked && !gameOver) {
    elapsedTime += dt;
    timeLeft -= dt * (sprinting ? (CFG.sprintDrainMul || 2.0) : 1);
    updateElapsedUI();

    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver = true;
      deathCount++;
      const deadRec = addRecord(playerName, elapsedTime, false, deathCount);
      renderLeaderboard('dead-leaderboard', playerName, elapsedTime, false, deadRec.ts);
      document.getElementById("dead-stats").textContent =
        "体力耗尽于: " + CFG.name + " | 用时: " + formatTime(elapsedTime) + " | 死亡次数: " + deathCount;
      deadOverlay.classList.add('show');
      controls.unlock();
      console.log('💀 体力耗尽... 死亡次数: ' + deathCount);
    }
    updateStaminaUI();

    // 杏仁水悬浮动画 & 拾取
    for (let i = almondPickups.length - 1; i >= 0; i--) {
      const item = almondPickups[i];
      item.mesh.position.y = 0.35 + Math.sin(elapsedTime * 2.5 + i * 1.7) * 0.08;
      item.mesh.rotation.y += dt * 0.8;
      const adx = pos.x - item.x;
      const adz = pos.z - item.z;
      if (adx * adx + adz * adz < 1.2 * 1.2) {
        timeLeft += (CFG.pickupBonus || 60);
        updateStaminaUI();
        worldGroup.remove(item.mesh);
        // 程序化回退瓶的几何/材质为实例私有，可安全释放；GLB 克隆共享 modelStore 资源，只移除
        item.mesh.traverse(child => {
          if (child.isMesh && !child.userData.isModelMesh) {
            if (child.geometry) child.geometry.dispose();
            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
            else if (child.material) child.material.dispose();
          }
        });
        almondPickups.splice(i, 1);
        showToast('💧 杏仁水 +' + (CFG.pickupBonus || 60) + ' 秒');
        console.log('💧 拾取杏仁水！剩余 ' + Math.ceil(timeLeft) + ' 秒');
      }
    }
  }

  // 出口门检测 — 仅在指针锁定时检测
  if (controls.isLocked && !gameOver) {
    for (const door of exitDoors) {
      const dx = pos.x - door.cx;
      const dz = pos.z - door.cz;
      if (dx * dx + dz * dz < 0.8 * 0.8) {
        if (!gameOver) {
          transitionToLevel(currentLevel + 1);
        }
        break;
      }
    }
  }

  // 围栏：防止走出地图
  pos.x = Math.max(CFG.playerRad, Math.min(CFG.gridW * CFG.roomSize - CFG.playerRad, pos.x));
  pos.z = Math.max(CFG.playerRad, Math.min(CFG.gridH * CFG.roomSize - CFG.playerRad, pos.z));

  landingFeedback.render(camera, renderFrame);
}

function renderFrame() {
  if (composer) composer.render(); else renderer.render(scene, camera);
}

function loadLeaderboard() {

  catch(e) { return []; }
}
function saveLeaderboard(records) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(records)); } catch(e) {}
}

function sortRecords(arr) {
  return arr.sort((a, b) => {
    if (a.time === null && b.time === null) return 0;
    if (a.time === null) return 1;
    if (b.time === null) return -1;
    return a.time - b.time;
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderTable(el, records, highlightName, highlightTime, highlightWon, highlightTs) {
  let html = '<h3>🏆 排行榜</h3><table><tr><th></th><th>玩家</th><th>时间</th><th>死亡</th></tr>';
  sortRecords(records).slice(0, 10).forEach((r, i) => {
    const isMe = highlightTs
      ? (r.ts === highlightTs)
      : (r.name === highlightName && r.time === (highlightWon ? highlightTime : null));
    html += '<tr class="' + (isMe ? 'me' : '') + '">';
    html += '<td class="rank">' + (i + 1) + '</td>';
    html += '<td>' + escapeHtml(r.name || '???') + '</td>';
    html += '<td class="time">' + (r.time !== null ? formatTime(r.time) : '--') + '</td>';
    html += '<td class="deaths">' + (Number(r.deaths) || 0) + '</td>';
    html += '</tr>';
  });
  html += '</table>';
  if (useCloud) html += '<div style="font-size:0.6rem;color:#666;text-align:center;margin-top:4px">☁️ 跨设备共享 · Supabase</div>';
  el.innerHTML = html;
}

function renderLeaderboard(containerId, highlightName, highlightTime, highlightWon, highlightTs) {

        if (data && data.length) renderTable(el, data, highlightName, highlightTime, highlightWon, highlightTs);

function addRecord(name, time, won, deaths) {

  // localStorage
  const records = loadLeaderboard();
  records.push(record);

  // Supabase
  if (useCloud && supabaseClient) {
    supabaseClient.from('leaderboard').insert(record).then(() => {
      console.log('☁️ 记录已同步');

      console.warn('云端同步失败:', e.message);

}

// 每关在随机非出生房生成若干杏仁水（GLB 优先，失败回退程序化瓶身）
function createPickups() {
  almondPickups.length = 0;
  const count = CFG.pickups || 1;
  const usedRooms = new Set();
  usedRooms.add(SPAWN_GX + ',' + SPAWN_GZ);
  let guard = 0;
  while (almondPickups.length < count && guard++ < 300) {
    const ax = Math.floor(Math.random() * CFG.gridW);
    const az = Math.floor(Math.random() * CFG.gridH);
    const key = ax + ',' + az;
    if (usedRooms.has(key)) continue;
    usedRooms.add(key);
    const cx = roomCenterX(ax), cz = roomCenterZ(az);
    const offset = CFG.roomSize * .26;
    const spot = [[0, 0], [offset, 0], [-offset, 0], [0, offset], [0, -offset]].find(([dx, dz]) =>
      !wallColliders.some(bb => circleIntersectsCollider(cx + dx, cz + dz, CFG.playerRad + .25, bb)));
    if (!spot) continue;
    const x = cx + spot[0], z = cz + spot[1];
    const almondGroup = createModelInstance('almond_water', 0.12, 0.32, 0.12)
      || buildProceduralAlmond();
    almondGroup.position.set(x, 0.35, z);
    worldGroup.add(almondGroup);
    almondPickups.push({ mesh: almondGroup, x, z });
    console.log('💧 杏仁水补给点已放置在房间 (' + ax + ',' + az + ')');
  }
}

// 程序化杏仁水瓶 — LatheGeometry 一体成型瓶身（GLB 加载失败时回退）
function buildProceduralAlmond() {
  const almondGroup = new THREE.Group();
  const glassMat = new THREE.MeshPhongMaterial({
    color: '#aaddff', emissive: '#113355', emissiveIntensity: 0.6,
    specular: '#ffffff', shininess: 80, transparent: true, opacity: 0.65,
    side: THREE.DoubleSide
  });
  const liquidMat = new THREE.MeshPhongMaterial({
    color: '#4499dd', emissive: '#3377cc', emissiveIntensity: 1.2,
    specular: '#ffffff', shininess: 80, transparent: true, opacity: 0.85
  });
  const capMat = new THREE.MeshPhongMaterial({
    color: '#ddd', specular: '#ffffff', shininess: 100
  });

  // 瓶身轮廓：从底部到顶部 (r, y) 点
  const profile = [];
  profile.push(new THREE.Vector2(0.16, 0.0));
  profile.push(new THREE.Vector2(0.17, 0.04));
  profile.push(new THREE.Vector2(0.17, 0.45));
  profile.push(new THREE.Vector2(0.14, 0.50));
  profile.push(new THREE.Vector2(0.06, 0.58));
  profile.push(new THREE.Vector2(0.055, 0.62));
  profile.push(new THREE.Vector2(0.055, 0.68));
  profile.push(new THREE.Vector2(0.06, 0.70));
  const bottleGeo = new THREE.LatheGeometry(profile, 24);
  almondGroup.add(new THREE.Mesh(bottleGeo, glassMat));

  // 内部液体
  const liqProfile = [];
  liqProfile.push(new THREE.Vector2(0.13, 0.03));
  liqProfile.push(new THREE.Vector2(0.14, 0.25));
  liqProfile.push(new THREE.Vector2(0.10, 0.30));
  liqProfile.push(new THREE.Vector2(0.0, 0.31));
  const liqGeo = new THREE.LatheGeometry(liqProfile, 20);
  almondGroup.add(new THREE.Mesh(liqGeo, liquidMat));

  // 瓶盖
  almondGroup.add(new THREE.Mesh(
    new THREE.CylinderGeometry(0.065, 0.062, 0.09, 16), capMat
  )).position.y = 0.73;
  almondGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.068, 12, 8), capMat
  )).position.y = 0.78;

  // 标签带
  const labelMat = new THREE.MeshPhongMaterial({
    color: '#f5f0e0', specular: '#444', shininess: 15
  });
  const labelGeo = new THREE.TorusGeometry(0.168, 0.012, 8, 24);
  almondGroup.add(new THREE.Mesh(labelGeo, labelMat)).position.y = 0.28;

  // 底部光晕
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5),
    new THREE.MeshBasicMaterial({ color: '#4488cc', transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false }));
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.02;
  almondGroup.add(glow);
  almondGroup.scale.setScalar(0.35);
  return almondGroup;
}

// ==================== 启动 — 等全部模型就绪后再构建关卡 ====================
function spawnSafetyCheck() {
  const sp = camera.position;
  let blocked = false;
  for (const bb of wallColliders) {
    if (circleIntersectsCollider(sp.x, sp.z, CFG.playerRad, bb)) {
      blocked = true; break;
    }
  }
  if (blocked) console.warn('⚠️ 出生点被障碍物阻挡！');
  else console.log('✅ 出生点安全');
}

// Exercise the real movement and collision grid in screenshot mode without
// pointer capture or leaderboard writes. Walk every pavilion perimeter and
// connect it to each open doorway in its generated room.
function checkPavilionRoutes() {
  const saved = camera.position.clone();
  const failures = [];
  let checked = 0;
  const route = (p, start, end, name) => {
    camera.position.set(p.x + start[0], CFG.eyeH, p.z + start[1]);
    tryMove(end[0] - start[0], end[1] - start[1]);
    checked++;
    if (Math.hypot(camera.position.x - p.x - end[0], camera.position.z - p.z - end[1]) > 0.001) {
      failures.push({ x: p.x, z: p.z, route: name });
    }
  };
  try {
    const r = CFG.roomSize / 2 - CFG.wallThick / 2 - CFG.playerRad - 0.15;
    const corners = [[-r, -r], [r, -r], [r, r], [-r, r]];
    for (const p of pavilionPlacements) {
      for (let i = 0; i < 4; i++) route(p, corners[i], corners[(i + 1) % 4], 'perimeter-' + i);
      const cell = maze[Math.floor(p.z / CFG.roomSize)][Math.floor(p.x / CFG.roomSize)];
      for (const [side, dx, dz] of [['n', 0, -1], ['s', 0, 1], ['e', 1, 0], ['w', -1, 0]]) {
        if (!cell.walls[side]) route(p, [dx * r, dz * r],
          [dx * (CFG.roomSize / 2 + 0.5), dz * (CFG.roomSize / 2 + 0.5)], 'door-' + side);
      }
    }
  } finally { camera.position.copy(saved); }
  return { pavilions: pavilionPlacements.length, checked, failures };
}

MODELS_READY.then(() => {
  try {
    buildCurrentLevel();
    spawnSafetyCheck();
  } catch(e) {
    console.error('关卡构建失败，仍启动渲染:', e);
    if (SHOT_MODE) console.log('[SHOT] FAILED');
  }
  animate();
  const startBtn = document.getElementById('start-btn');
  startBtn.disabled = false;
  startBtn.textContent = '开始探索';
  const loadedCount = Object.keys(modelStore).length;
  document.getElementById('load-status').textContent = loadedCount === MODEL_NAMES.length
    ? '所有物件已就绪 · 寻找出口，留意补给'
    : `场景已就绪 · ${MODEL_NAMES.length - loadedCount} 个物件使用备用模型`;
  document.body.dataset.sceneReady = String(currentLevel);
  document.body.dataset.exits = String(exitDoors.length);
  document.body.dataset.pickups = String(almondPickups.length);
  console.log('🏚️  Backrooms ' + CFG.name + ' 已就绪');
  console.log('   ' + CFG.gridW + '×' + CFG.gridH + ' 迷宫 · ' + (CFG.gridW * CFG.roomSize) + '×' + (CFG.gridH * CFG.roomSize) + ' 单位');
  console.log('   点击屏幕锁定鼠标，WASD 移动探索');

  // 截图模式：隐藏 UI、摆好机位、通知驱动抓图
  if (SHOT_MODE) {
    overlay.classList.add('hidden');
    info.style.opacity = '0';
    camera.lookAt(
      camera.position.x + (CFG.theme === 'garden' ? 3.5 : 6),
      CFG.eyeH * 0.88,
      camera.position.z + (CFG.theme === 'garden' ? 4 : 6)
    );
    const shotView = new URLSearchParams(location.search).get('view');
    if (shotView === 'exit' && exitDoors.length) {
      const door = exitDoors[0];
      camera.position.set(door.cx + door.nx * 3.1, 1.55, door.cz + door.nz * 3.1);
      camera.lookAt(door.cx, 1.3, door.cz);
    } else if (shotView === 'pickup' && almondPickups.length) {
      const pickup = almondPickups[0];
      camera.position.set(pickup.x + .35, CFG.eyeH, pickup.z + 1.25);
      camera.lookAt(pickup.x, .51, pickup.z);
    } else if (shotView === 'pavilion' && pavilionPlacements.length) {
      const p = pavilionPlacements[0];
      const r = CFG.roomSize / 2 - CFG.wallThick / 2 - CFG.playerRad - 0.2;
      camera.position.set(p.x + r, CFG.eyeH, p.z + r);
      camera.lookAt(p.x, 2.4, p.z);
    }
    renderer.info.autoReset = false;
    renderer.info.reset();
    if (composer) composer.render(); else renderer.render(scene, camera);
    document.body.dataset.renderCalls = String(renderer.info.render.calls);
    document.body.dataset.renderTriangles = String(renderer.info.render.triangles);
    document.body.dataset.modelsLoaded = String(loadedCount);
    document.body.dataset.quality = QUALITY_TIERS[tierIndex];
    document.body.dataset.pixelRatio = String(currentPixelRatio);
    document.body.dataset.postprocessing = JSON.stringify(composer ? composer.passes.map(p => p.constructor.name) : []);
    document.body.dataset.pavilionRoutes = JSON.stringify(checkPavilionRoutes());
    renderer.info.autoReset = true;
    console.log('[SHOT] READY level=' + currentLevel + ' theme=' + CFG.theme);
  }
});
